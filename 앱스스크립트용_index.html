<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해법 영단어</title>
<style>
  :root{
    --primary:#E8651A; --primary-dark:#C8500C; --soft:#FFEDDF;
    --bg:#FFF7EF; --card:#FFFFFF; --line:#F0E2D4;
    --text:#2B2018; --sub:#8A7767;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
      "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }

  /* 뒤에 깔리는 옛 간판 — 팝업 위로 살짝 보이게 */
  .back{
    position:fixed;top:0;left:0;right:0;padding:44px 20px 0;
    text-align:center;user-select:none;
  }
  .back .brand{font-size:12px;font-weight:800;letter-spacing:4px;color:var(--primary)}
  .back .title{font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:5px;color:var(--text)}

  /* 팝업 */
  .dim{
    position:fixed;inset:0;background:rgba(43,32,24,.42);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fade .25s ease both;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  .pop{
    width:100%;max-width:400px;background:var(--card);border-radius:22px;
    padding:28px 24px 24px;text-align:center;
    box-shadow:0 18px 50px rgba(43,32,24,.22);
    animation:pop .32s cubic-bezier(.2,.9,.3,1.1) both .08s;
  }
  .ic{
    width:58px;height:58px;margin:0 auto 14px;border-radius:19px;
    background:var(--soft);display:flex;align-items:center;justify-content:center;
  }
  .ic svg{width:30px;height:30px;stroke:var(--primary);stroke-width:2.1;
    fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.4px}
  .lead{margin:9px 0 0;font-size:13.5px;font-weight:600;color:var(--sub);line-height:1.65}

  .addr{
    margin-top:16px;background:var(--bg);border:1.5px solid var(--line);
    border-radius:13px;padding:12px 14px;
    font-size:12.5px;font-weight:700;color:var(--primary-dark);
    word-break:break-all;line-height:1.5;
  }

  .go{
    display:block;margin-top:16px;background:var(--primary);color:#fff;
    text-decoration:none;font-weight:900;font-size:16px;
    padding:16px;border-radius:15px;
    box-shadow:0 5px 0 var(--primary-dark);
    transition:transform .1s, box-shadow .1s;
  }
  .go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-dark)}

  .steps{
    margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--line);
    text-align:left;
  }
  .steps b{display:block;font-size:12.5px;font-weight:800;margin-bottom:7px}
  .steps ol{margin:0;padding-left:19px}
  .steps li{font-size:12.5px;font-weight:600;color:var(--sub);line-height:1.75}
  .steps em{font-style:normal;font-weight:800;color:var(--text)}

  .foot{margin-top:14px;font-size:11.5px;font-weight:600;color:var(--sub)}
</style>
</head>
<body>

<div class="back">
  <div class="brand">홍제인왕해법영어</div>
  <div class="title">해법 영단어</div>
</div>

<div class="dim">
  <div class="pop">
    <div class="ic">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h13M13 6l6 6-6 6"/>
      </svg>
    </div>

    <h1>앱 주소가 바뀌었어요</h1>
    <p class="lead">
      휴대폰으로 <b>알림</b>을 받을 수 있게<br>새 주소로 옮겼습니다.
    </p>

    <div class="addr" id="addr">주소를 불러오는 중…</div>

    <a class="go" id="go" href="#" target="_top">새 주소로 가기</a>

    <div class="steps">
      <b>가서 이것만 해 두세요</b>
      <ol>
        <li>새 주소에서 <em>즐겨찾기</em>를 다시 해 주세요</li>
        <li>아이폰은 <em>사파리</em>로 열어 <em>홈 화면에 추가</em></li>
        <li>앱에서 <em>「알림 켜기」</em>를 한 번 누르면 끝</li>
      </ol>
    </div>

    <div class="foot">예전 주소(이 화면)는 이제 쓰지 않습니다</div>
  </div>
</div>

<script>
(function(){
  /* 주소는 Code.gs 의 「새주소」 한 곳에서만 고칩니다 */
  var 새주소 = '<?= 새주소 ?>';
  if(!새주소) 새주소 = 'https://smarthb-english.github.io/Vocab/';

  document.getElementById('addr').textContent =
    새주소.replace(/^https?:\/\//, '').replace(/\/$/, '');

  var a = document.getElementById('go');
  a.href = 새주소;

  /* 앱스 스크립트 화면은 틀(iframe) 안에서 돌아갑니다.
     그래서 안쪽이 아니라 바깥 창(top)을 바꿔 줘야 주소까지 제대로 옮겨집니다. */
  function 넘어가기(){
    try { window.top.location.replace(새주소); return true; }
    catch (err) {
      try { window.top.location.href = 새주소; return true; }
      catch (err2) { location.href = 새주소; return false; }
    }
  }
  /* 자동으로 넘기지 않습니다 — 단추를 눌러야 갑니다 */
  a.addEventListener('click', function(e){ e.preventDefault(); 넘어가기(); });
})();
</script>
</body>
</html>
