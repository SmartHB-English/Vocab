  if(시) 줄.push('최근 시험 '+시.날짜+' '+시.유형+' '+시.점수+'점');
  if((r.자주틀린||[]).length) 줄.push('자주 틀리는 단어: '+r.자주틀린.slice(0,5).map(function(w){return w.단어;}).join(', '));
  if(r.한마디) 줄.push('선생님 한마디: '+r.한마디);

}

/* ---------- 서버가 돌려준 바뀐 줄만 목록에 — 통째로 다시 받지 않는다 ----------
   숙제: 새 줄이나 고친 줄 하나 · 숙제들: 여러 줄 · 지운행: 지운 줄번호들 (그 아래 줄번호를 당긴다).
   옛 서버(숙제목록 통째)도 받는다 — 재배포 순서가 어긋나도 돌게. 반영한 게 없으면 false */
function 숙제반영_(r){
  if(!T.data || !r) return false;
  T.숙제판 = (T.숙제판||0) + 1;                       /* 목록이 바뀐 차례 — 늦게 온 지우기 답이 알아본다 */
  if(r.숙제목록){ T.data.숙제목록 = r.숙제목록; return true; }
  var L = (T.data.숙제목록||[]).slice(), 했나 = false, 못맞춤 = false;
  if(r.지운행 && r.지운행.length){ L = 행당기기_(L, r.지운행); 했나 = true; }
  (r.숙제 ? [r.숙제] : []).concat(r.숙제들||[]).forEach(function(h){
    if(!h) return;
    /* 등록시각(낸때)으로 먼저 찾는다 — 답이 오는 사이 다른 줄을 지워 줄번호가 당겨졌을 수 있다 */
    var i = -1;
    if(h.낸때) L.forEach(function(x, j){ if(x.낸때 === h.낸때) i = j; });
    if(i < 0) L.forEach(function(x, j){ if(x.행 === h.행 && (!h.낸때 || !x.낸때)) i = j; });
    if(i > -1){ L[i] = Object.assign({}, L[i], h, {행: h.낸때 ? L[i].행 : h.행}); 했나 = true; return; }
    if(!h.단어장){ 못맞춤 = true; return; }          /* 시간만 온 줄인데 짝이 없다 — 지어내지 말고 서버 것으로 맞춘다 */
    L.push(JSON.parse(JSON.stringify(h)));
    했나 = true;
  });
  T.data.숙제목록 = L;
  if(못맞춤){ setTimeout(loadTeacher, 0); return true; }
  return 했나;
}
/* 줄을 지우면 그 아래 줄들의 행 번호가 하나씩 밀린다 — 시트와 똑같이 당겨 둬야 다음 삭제·수정이 엉뚱한 줄을 안 건드린다 */
function 행당기기_(목록, 지운행){
  var 지 = {}; (지운행||[]).forEach(function(n){ 지[Number(n)] = 1; });
  var 차례 = (지운행||[]).map(Number);
  return (목록||[]).filter(function(h){ return !지[h.행]; }).map(function(h){
    var 앞 = 0; 차례.forEach(function(n){ if(n < h.행) 앞++; });
    return 앞 ? Object.assign({}, h, {행: h.행 - 앞}) : h;
  });
}

/* ---------- 단어 그림 ---------- */
/* 큰 사진을 그대로 올리면 드라이브도 무겁고 아이들 화면도 느리다.
   올리기 전에 400px 안쪽으로 줄여서 보낸다. */
function 그림줄이기_(파일, 최대){
  최대 = 최대 || 400;
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('읽지 못했습니다')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(new Error('그림 파일이 아닙니다')); };
      img.onload = function(){
        var w = img.naturalWidth || 최대, h = img.naturalHeight || 최대;
        var 배 = Math.min(1, 최대 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * 배));
        c.height = Math.max(1, Math.round(h * 배));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        /* 배경이 뚫린 그림은 png 로 (jpeg 로 바꾸면 뒤가 까매진다) */
        var 종류 = /png|webp|gif|svg/i.test(파일.type || '') ? 'image/png' : 'image/jpeg';
        var url = c.toDataURL(종류, 0.85);
        res({ 이름: 파일.name, 종류: 종류, 자료: url.slice(url.indexOf(',') + 1) });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(파일);
  });
}



/* 그림 여러 장을 여섯 장씩 나눠 올린다 (한 번에 다 보내면 시간이 넘친다) */
function 그림여러장보내기_(파일들){
  파일들 = (파일들 || []).filter(function(f){ return f && /^image\//.test(f.type || ''); });
  if(!파일들.length){ toast('그림 파일을 골라 주세요'); return; }
  var 묶음 = 6, i = 0, 붙인 = 0, 못찾은 = [];
  toast(파일들.length + '장 올리는 중…');
  function 다음(){
    if(i >= 파일들.length){
      toast(붙인 + '장을 붙였습니다' + (못찾은.length ? ' · 짝 못 찾은 것 ' + 못찾은.length + '장' : ''));
      if(못찾은.length){
        alert('이 파일들은 같은 이름의 단어를 찾지 못했습니다.\n\n' +
              못찾은.slice(0, 30).join('\n') +
              (못찾은.length > 30 ? '\n… 그 밖에 ' + (못찾은.length - 30) + '장' : '') +
              '\n\n파일 이름을 영어 단어와 같게 해 주세요. (예: cat.png)');
      }
      단어불러오기();
      return;
    }
    var 조각 = 파일들.slice(i, i + 묶음);
    i += 묶음;
    toast('올리는 중… ' + Math.min(i, 파일들.length) + ' / ' + 파일들.length);
    Promise.all(조각.map(function(f){
      return 그림줄이기_(f).catch(function(){ return { 탈:f.name }; });
    })).then(function(것들){
      var 보낼 = [];
      것들.forEach(function(x){ if(x.탈) 못찾은.push(x.탈); else 보낼.push(x); });
      if(!보낼.length){ 다음(); return; }
      return api('그림여러개', T.pw, T.책, 보낼).then(function(r){
        if(r && r.ok){ 붙인 += r.붙인수 || 0; 못찾은 = 못찾은.concat(r.못찾은 || []); 다음(); return; }
        /* 권한처럼 더 해 봐야 소용없는 탈이면 거기서 멈춘다 */
        알림띄우기_(r && r.메시지, '올리지 못했습니다');
        단어불러오기();
      });
    }).catch(function(){ toast('올리지 못했습니다'); });
  }
  다음();
}

function 알림띄우기_(글, 기본){
  var t = String(글 || '').trim() || 기본;

/* 파일 고르개를 띄운다 */
function 그림고르기_(여러장, 하기){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if(여러장) inp.multiple = true;
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var 것 = [].slice.call(inp.files || []);
    document.body.removeChild(inp);
    if(것.length) 하기(것);
  };
  inp.click();
}

/* ---------- 과 한 장 읽기 ----------
   1. 빈 줄은 넘긴다   2. // 로 시작하면 주석 — 넘긴다
   3. # 으로 시작하면 머리줄 — 앞의 # 과 공백을 떼고, 단어·본문·문법·3단변화 면 구분, 아니면 단어장 이름
      (## 이냐 ### 이냐로 가리지 않는다)
   4. | 가 있으면 자료 — 지금 구분으로   5. 그 밖의 줄은 넣지 않고 경고에 모은다 (통째로 거절하지 않는다)
   7. 구분 머리줄 전에 나온 자료는 단어   8. 자료가 없는 구분은 비워 둔다 */
function 과읽기_(글){
  var r = {이름:'', 구분들:{단어:[], 본문:[], 문법:[], '3단변화':[]}, 경고:[], 합:0};
  var 칸 = '단어';
  String(글||'').split(/\r?\n/).forEach(function(줄, i){
    var t = 줄.trim();
    if(!t || t.indexOf('//') === 0) return;
    if(t.charAt(0) === '#'){
      var 말 = t.replace(/^#+\s*/, '').trim();
      if(['단어','본문','문법','3단변화'].indexOf(말) > -1) 칸 = 말;
      else if(말) r.이름 = 말;
      return;
    }
    if(t.indexOf('|') > -1){
      var 쪽 = t.split('|').map(function(x){ return x.trim(); });
      if(쪽[0] && 쪽[1]){
        r.구분들[칸].push({en:쪽[0], ko:쪽[1], 비고:쪽.slice(2).join(' | ').trim()});
        r.합++;
        return;
      }
    }
    r.경고.push({줄:i+1, 글:t});
  });
  return r;
}
/* 과 단어장 → 위와 똑같은 꼴의 글 (뽑아서 다시 넣으면 그대로 들어간다) */
function 과글로_(이름, 단어들){
  var 줄 = ['## '+이름];
  어디차례_.forEach(function(k){
    var 것 = (단어들||[]).filter(function(w){ return (w.칸||'단어') === k; });
    if(!것.length) return;
    줄.push('', '### '+k);
    것.forEach(function(w){
      var 비고 = w.비고 || w.그림 || '';
      줄.push(w.en+' | '+w.ko+(비고 ? ' | '+비고 : ''));
    });
  });
  return 줄.join('\n')+'\n';
}

/* "go - went - gone" 을 원형·과거·과거분사 세 칸으로 나눈다.
   "be - was/were - been" 처럼 빗금이 들어 있어도 그대로 한 칸에 둔다. */
function 삼단쪼개기_(en){
  var 조각 = String(en||'').split(/\s*[\-\u2013\u2014]\s*/)
    .map(function(x){ return x.trim(); }).filter(String);
  if(조각.length >= 3) return [조각[0], 조각[1], 조각.slice(2).join(' - ')];
  if(조각.length === 2) return [조각[0], 조각[1], ''];
  return [조각[0] || '', '', ''];
}

    '<div class="cfrom">'+esc(학원이름_())+'</div>'+
  '</div>');
}

/* 학부모용 월간 안내문 한 장 — r: 시상 표 한 줄, 시험들: 그 학생 최근 기록 */
function 안내문종이(r, 달, 시험들){
  function 칸(라벨, 값, 단위, 설명){
    return '<div><div class="l">'+esc(라벨)+'</div>'+
      '<div class="v">'+값+(단위?'<small>'+단위+'</small>':'')+'</div>'+
      '<div class="d">'+esc(설명||'')+'</div></div>';
  }
  var 최근 = (시험들||[]).slice(0, 8);
  var 변화 = '';
  if(r.향상 !== null && r.향상 !== undefined && r.지난평균 !== null && r.지난평균 !== undefined){
    변화 = r.향상 > 0
      ? '지난달 '+r.지난평균+'점에서 <b>'+r.향상+'점 올랐습니다.</b>'
      : (r.향상 < 0 ? '지난달 '+r.지난평균+'점에서 '+Math.abs(r.향상)+'점 내렸습니다.'
                    : '지난달과 같은 평균입니다.');
  }
  return 종이_(
    종이머리_(달+' 영어 단어 학습 안내', '', '', '')+
    '<div class="pnbody">'+
    '<div class="pto">'+esc(r.이름)+' 학생'+
      '<small>학부모님께 · 한 달 동안의 단어 학습 결과를 알려 드립니다.</small></div>'+
    '<div class="psum">'+
      칸('숙제 제출률', (r.제출률===null||r.제출률===undefined?'-':r.제출률), '%',
        r.숙제수 ? r.숙제수+'개 중 '+r.낸수+'개' : '내준 숙제 없음')+
      칸('단어 시험 평균', (r.평균===null||r.평균===undefined?'-':r.평균), '점',
        (r.건수||0)+'번 봄' + (r.못낸 ? ' · 안 낸 '+r.못낸+'개 0점' : ''))+
      칸('학원 시험 평균', (r.시험평균===null||r.시험평균===undefined?'-':r.시험평균), '점',
        (r.시험건수||0)+'번 봄')+
    '</div>'+
    (변화 ? '<div style="font-size:12.5px;margin-top:9px;color:#333">'+변화+'</div>' : '')+
    (r.만점 ? '<div style="font-size:12.5px;margin-top:4px;color:#333">만점을 <b>'+r.만점+'번</b> 받았습니다.</div>' : '')+
    (최근.length
      ? '<div class="ptit">최근 시험 기록</div>'+
        '<table class="plist">'+최근.map(function(t){
          return '<tr><td class="m">'+esc(String(t.시각).slice(0,5))+'</td>'+
            '<td>'+esc(t.단어장)+' <span class="m">'+esc(t.범위)+'</span></td>'+
            '<td>'+t.점수+'점</td></tr>';
        }).join('')+'</table>'
      : '')+
    '<div class="ptit">선생님 한마디</div>'+
    '<div class="psay"><div class="pruled"></div></div>'+
    '<div class="psign"><div class="d">'+esc(오늘한글_())+'</div>'+
      '<div class="n">'+esc(학원이름_())+'</div></div>'+
    '</div>');
}

function 인쇄하기(html, 양면){
  var 칸=$('printArea');
  if(!칸){ toast('인쇄할 수 없습니다'); return; }
  칸.classList.toggle('duplex', !!양면);
  칸.innerHTML = html;
  setTimeout(function(){
    try { window.print(); }
    catch(e){ toast('인쇄 창을 열지 못했습니다'); }
  }, 80);
}

/* ------------------------------- 학생 화면에 있던 것 — 선생님만 쓴다 */
function 오늘값(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* 선생님 화면·시험지 — 레슨 번호와 단어 번호를 같이 */
function 선생님범위글_(단어장, a, b){
  var i = 책칸_(단어장, (T && T.data && T.data.단어장목록) || []);
  return 레슨글_(i.묶음, i.총, a, b, true);
}
