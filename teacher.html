     폰 앱(Capacitor) 번들에는 넣지 않는다 — 앱의 선생님 입구는 이 파일의 깃헙 주소를 바깥 브라우저로 연다.
     공용 CSS·JS 는 아래 GENERATED 블록에 박힌다 (원본은 services/shared-ui.css · services/shared-ui.js). -->

  html,body{background:#fff !important;margin:0;padding:0;height:auto}
  body > *{display:none !important}
  #printArea{display:block !important;color:#000;font-family:var(--font)}
  @page{size:A4 portrait;margin:14mm 15mm 12mm}
}
.psheet{page-break-after:always;break-after:page}
.psheet:last-child{page-break-after:auto;break-after:auto}
/* 양면으로 뽑을 때 — 앞면은 왼쪽, 뒷면은 오른쪽에 묶는 여백을 둔다 */

.ppaper.duplex .psheet:nth-child(even){padding-right:7mm}
#printArea.duplex .psheet:nth-child(even) .pfoot,

.phead{border-bottom:2.5px solid #111;padding-bottom:8px;margin-bottom:2px}
.phead .pacademy{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#555}
.phead .ptitle{font-size:22px;font-weight:900;letter-spacing:-.6px;margin-top:3px}
.phead .prange{font-size:13px;color:#333;margin-top:3px;font-weight:600}
.pmeta{display:flex;gap:26px;font-size:13px;font-weight:700;padding:9px 2px 0;color:#111}
.pmeta span{white-space:nowrap}
.pmeta i{font-style:normal;color:#666;font-weight:600;margin-right:5px}
.pnote{font-size:11px;color:#666;margin:7px 0 0;padding-bottom:9px;border-bottom:1px solid #bbb}
.qtable{width:100%;border-collapse:collapse;margin-top:6px}
.qtable td{padding:0;border:0;vertical-align:bottom}
.qtable tr{height:38px}
.qtable .qn{width:28px;font-size:12px;color:#777;font-weight:700;text-align:right;padding:0 9px 4px 0}
.qtable .qk{width:33%;font-size:14px;font-weight:600;padding:0 12px 3px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtable .qa{border-bottom:1.2px solid #8A8A8A}
.qtable .qa.ans{border-bottom:1px solid #D5D5D5;font-size:14px;font-weight:700;padding:0 0 3px 6px;color:#000}
.qtable tr.dim td{background:#F4F4F4}
.qtable .qn{font-size:12.5px;color:#333;font-weight:800}

.qtable .qx i{display:inline-block;width:22px;height:22px;border:1px solid #AAA;border-radius:4px;
  background:#fff;vertical-align:bottom}
/* 불규칙 동사 3단변화 전용 시험지 — 원형을 주고 과거·과거분사를 쓰게 한다 */
.vtable{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.vtable td{padding:0;border:0;vertical-align:bottom}
.vtable tr{height:30px}
.vtable tr.vhead{height:26px}
.vtable tr.vhead td{font-size:10.5px;font-weight:800;color:#555;letter-spacing:.5px;
  padding:0 0 4px 6px;border-bottom:1.5px solid #333 !important;vertical-align:bottom}
.vtable tr.vhead td.qn{padding-left:0}
.vtable .qn{width:26px;font-size:12px;color:#333;font-weight:800;text-align:right;padding:0 8px 4px 0}
.vtable .vk{width:20%;font-size:12.5px;font-weight:600;padding:0 10px 4px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtable .v1{width:18%;font-size:13.5px;font-weight:700;padding:0 10px 4px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 두 빈칸 사이를 벌려 놓는다 — 붙어 있으면 한 줄로 보인다 */
.vtable .vsp{width:4%}
.vtable .vb{width:24%;border-bottom:1.2px solid #8A8A8A}
.vtable .vb.ans{border-bottom:1px solid #D5D5D5;font-size:13.5px;font-weight:700;
  padding:0 0 4px 6px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtable tr.dim td{background:#F4F4F4}
.vtable .qx{width:34px;padding:0 0 4px 10px;text-align:right}
.vtable .qx i{display:inline-block;width:20px;height:20px;border:1px solid #AAA;border-radius:4px;
  background:#fff;vertical-align:bottom}
.pfoot{margin-top:12px;font-size:10.5px;color:#888;display:flex;justify-content:space-between}
/* 학부모 안내문 */
.pto{font-size:14.5px;font-weight:800;margin:12px 0 2px}
.pto small{display:block;font-size:11.5px;font-weight:600;color:#666;margin-top:3px}
.psum{display:flex;gap:9px;margin:13px 0 0}
.psum > div{flex:1;border:1.5px solid #222;border-radius:9px;padding:10px 6px;text-align:center}
.psum .l{font-size:11px;color:#555;font-weight:800}
.psum .v{font-size:24px;font-weight:900;margin-top:3px;letter-spacing:-.5px}
.psum .v small{font-size:12px;font-weight:800}
.psum .d{font-size:10.5px;color:#777;margin-top:2px}
.ptit{font-size:12.5px;font-weight:800;margin:16px 0 5px;padding-bottom:4px;border-bottom:1.5px solid #333}
.plist{width:100%;border-collapse:collapse;font-size:12.5px}
.plist td{padding:7px 4px;border-bottom:1px solid #DDD}
.plist td:first-child{width:52px}
.plist td:nth-child(2){width:auto}
.plist td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.plist .m{color:#666}
.psay{border:1.2px solid #888;border-radius:9px;padding:11px 13px 6px;margin-top:8px;
  flex:1;display:flex;flex-direction:column;justify-content:flex-start}
.psay .l{font-size:11.5px;font-weight:800;color:#555;margin-bottom:9px}
.pruled{flex:1;min-height:40mm;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0 27px, #CFCFCF 27px 28px)}
.pnbody{display:flex;flex-direction:column;min-height:228mm}
.psign{margin-top:18px}
.psign{text-align:center}
.psign .d{font-size:12.5px;letter-spacing:1px;color:#444}
.psign .n{font-size:17px;font-weight:900;margin-top:6px;letter-spacing:1px}

/* 상장 */
.pcert{text-align:center;padding:14mm 10mm;border:3px double #7A5A2A;height:262mm;
  display:flex;flex-direction:column;justify-content:center}
.pcert .ct{font-size:46px;font-weight:900;letter-spacing:16px;color:#7A5A2A;margin-bottom:26px}
.pcert .cwho{font-size:26px;font-weight:800;margin:20px 0 6px}
.pcert .cbody{font-size:16px;line-height:2.4;margin:22px 40px;text-align:center;word-break:keep-all}
.pcert .cprize{font-size:20px;font-weight:900;color:#7A5A2A}
.pcert .cdate{margin-top:34px;font-size:15px;letter-spacing:2px}
.pcert .cfrom{margin-top:14px;font-size:21px;font-weight:900;letter-spacing:1.5px}

/* ===================== 테마 ===================== */
:root{
  --r:22px; --r-sm:14px;
  --ok:#16A34A; --ng:#EF4444; --warn:#F59E0B;
  --font:'Pretendard','맑은 고딕','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
/* 초중등 : 밝고 말랑 */
html[data-theme="kid"]{
  --bg:#FAF6F1; --bg2:#FAF6F1;
  --card:#FFFFFF; --line:#ECE5DC;
  --text:#1C1A17; --sub:#7A726A;
  --primary:#E8651A; --primary-d:#C2410C; --primary-soft:#FFF1E4;
  --accent:#2F6FE0; --accent-soft:#E7EEFC; --ok:#15803D;
  --qsize:42px; --btn:19px; --radius:26px;
}
/* 고등 : 담백하고 진지 */
html[data-theme="high"]{
  --bg:#0E1520; --bg2:#131C2A;
  --card:#182231; --line:#26344A;
  --text:#E8EDF5; --sub:#8698B0;
  --primary:#4C8DFF; --primary-d:#2F6FE0; --primary-soft:#1D2B41;
  --accent:#22C7A9; --accent-soft:#12302C;
  --qsize:38px; --btn:17px; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
/* 위에서 아래로 당겨도 새로고침되지 않게 한다 —
   시험 도중에 화면이 통째로 다시 불려 답이 날아가는 일을 막는다.
   새로고침은 숙제 화면의 「↻」 로만 한다. */
html{overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain}
body{
  background:var(--bg);
  color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100%}
.screen{display:none;animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:12px}
h1,h2,h3{margin:0}
.title{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:10px}
.hide{display:none !important}

button{font-family:inherit;cursor:pointer;border:0}
.btn{
  display:block;width:100%;padding:16px;border-radius:var(--r-sm);
  background:var(--primary);color:#fff;font-size:var(--btn);font-weight:700;
  box-shadow:0 4px 0 var(--primary-d); transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
/* 3단변화 시험 — 「확인」과 「다음 문제」를 다른 자리에 둔다.
   같은 자리면 아이가 톡톡 두 번 눌러 단어를 건너뛴다.
   「확인」은 사라져도 자리를 차지한 채 숨어야 「다음 문제」가 위로 올라오지 않는다. */
/* ===================== 단어장 보기 ===================== */
.wbtop{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.wbname{font-size:14px;font-weight:800;letter-spacing:-.3px;margin-bottom:9px}
.wbname small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:2px}
.wblist{padding-bottom:30px}
.wbrow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.wbrow .wbno{flex:0 0 26px;font-size:11.5px;font-weight:800;color:var(--sub);text-align:right}
.wbrow .wben{flex:0 0 42%;text-align:left;font-size:17px;font-weight:800;
  letter-spacing:-.2px;word-break:break-word;background:none;color:var(--text);padding:0}
.wbrow .wbko{flex:1;font-size:14px;font-weight:600;color:var(--sub);word-break:break-word}
/* 3단변화 단어장은 영어가 길다 — 영어 칸을 넓게 */
.wblist.verb .wbrow .wben{flex:0 0 56%;font-size:16px}
.wblist.verb .wbrow .wbko{font-size:13px}
/* 교과서 본문은 문장이다 — 영어와 해석을 위아래로 쌓는다 */
.wblist.sent .wbrow{flex-wrap:wrap;align-items:flex-start}
.wblist.sent .wbrow .wben{flex:1 1 auto;font-size:16px;line-height:1.5;font-weight:700;min-width:0}
.wblist.sent .wbrow .wbko{flex:0 0 100%;font-size:13.5px;line-height:1.55;margin-left:36px}
.wbrow .wbstar{flex:0 0 30px;font-size:19px;line-height:1;color:var(--line);
  background:none;padding:0;text-align:center}
.wbrow.on .wbstar{color:var(--warn)}
.wbrow.on{border-color:var(--warn)}
.wbrow .wben.say{color:var(--accent)}
/* 가리기 — 덮인 칸은 회색 띠로 보인다. 줄을 누르면 그 줄만 열린다 */
.wblist.hideko .wbrow:not(.open) .wbko,
.wblist.hideen .wbrow:not(.open) .wben{
  color:transparent;background:var(--line);border-radius:7px;min-height:20px;
  user-select:none
}
.wbempty{text-align:center;color:var(--sub);font-size:13px;font-weight:600;padding:26px 0}
/* 채점이 끝난 「확인」 — 사라지지 않고, 눌린 채로 흐려진다.
   자리를 그대로 지키므로 아래의 「다음 문제」가 위로 올라오지 않는다. */
#vSubmit.gone{
  opacity:.4;
  transform:scale(.985);
  background:var(--primary-d);
  pointer-events:none;
  cursor:default;
}
#vNext{margin-top:26px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:none;background:var(--primary-soft)}
.btn.accent{background:var(--accent);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.sm{padding:11px;font-size:14px;border-radius:10px;box-shadow:none}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--sub);box-shadow:none}

input,select,textarea{
  width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);font-size:16px;font-family:inherit;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{width:auto;padding:0;margin:0 6px 0 0;transform:scale(1.15);vertical-align:-1px}
label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin:0 0 5px 2px}

.chip{
  padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);font-size:14px;font-weight:600
}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ---- 로그인 간판 ---- */
.signboard{text-align:center;padding:40px 0 26px}
.sbname{font-size:13px;font-weight:800;letter-spacing:3.5px;color:var(--primary);
  text-indent:3.5px;margin-bottom:9px}
.sbtitle{font-size:34px;font-weight:900;letter-spacing:-1.4px;line-height:1.15;color:var(--text)}
.sbrule{display:flex;align-items:center;gap:12px;margin:16px auto 0;max-width:260px}
.sbrule i{flex:1;height:1px;background:var(--line)}
.sbrule b{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.brandline{font-size:10.5px;font-weight:800;letter-spacing:2.4px;color:var(--primary);
  margin-bottom:3px;text-indent:1px}

/* 카드에 아주 옅은 그림자 — 종이처럼 살짝 떠 보이게 */
html[data-theme="kid"] .card,
html[data-theme="kid"] .hubcard{box-shadow:0 2px 8px rgba(120,70,30,.06)}
html[data-theme="high"] .card,
html[data-theme="high"] .hubcard{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.lesw{font-size:12px;font-weight:600;opacity:.45;margin:5px 0 0 2px;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppaper{background:#fff;color:#111;border:1px solid #D8DEE8;border-radius:8px;
  padding:22px 24px;max-height:64vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ppaper .psheet + .psheet{margin-top:22px;padding-top:22px;border-top:2px dashed #CBD2DD}
.foldbtn{background:none;border:0;padding:8px 2px 2px;color:var(--sub);font-size:13px;font-weight:700;text-align:left;display:block}
.foldbtn:active{color:var(--primary)}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill.hw{background:var(--warn);color:#fff}
.pill.today{background:#EF4444;color:#fff}
.pill.soon{background:#F59E0B;color:#fff}
.pill.later{background:var(--accent);color:#fff}
.pill.me{background:#7C5CFF;color:#fff}
.pill.ok{background:var(--ok);color:#fff}

.hwsec{margin-bottom:16px}
.hwsec-t{display:flex;justify-content:space-between;align-items:baseline;
  font-size:15px;font-weight:800;margin:0 4px 8px}
.hwsec-t .sub{font-size:12px;font-weight:700}
.hwsec.today .hwsec-t{color:#EF4444}
.hwsec.later .hwsec-t{color:var(--accent)}
.hwsec.siheom .hwsec-t{color:#92400E}

/* 첫 화면 고르기 */
.hubcard{
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:19px 18px;margin-bottom:11px;color:var(--text);font-family:inherit
}
.hubcard:active{transform:scale(.99);background:var(--primary-soft)}
.hubcard .ico{font-size:34px;line-height:1;flex:none}
.hubcard .t{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.hubcard .d{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-top:3px;line-height:1.35}
.hubcard > span:nth-child(2){flex:1;min-width:0}
.hubcard .cnt{margin-left:auto;flex:none}

/* 짝 맞추기 */
.mtboard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mtc{
  aspect-ratio:3/4;border-radius:13px;border:1.5px solid var(--line);
  background:var(--primary);color:#fff;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:5px;
  font-size:13px;font-weight:800;line-height:1.2;word-break:break-word;text-align:center;
  transition:transform .12s
}
.mtc .face{display:none}
.mtc.open,.mtc.done{background:var(--card);color:var(--text);border-color:var(--primary)}
.mtc.open .face,.mtc.done .face{display:block}
.mtc.open .back,.mtc.done .back{display:none}
.mtc.done{border-color:var(--ok);color:var(--ok);opacity:.55}
.mtc.miss{border-color:var(--ng);color:var(--ng)}
.mtc:active{transform:scale(.95)}
.mtc.en{font-family:inherit}
@media (max-width:360px){ .mtboard{gap:6px} .mtc{font-size:12px} }

/* 글자 퍼즐 */
.pzslots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:16px}
.pzslot{
  width:34px;height:44px;border-radius:9px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;background:var(--bg)
}
.pzslot.on{border-color:var(--primary);color:var(--primary)}
.pzslot.ok{border-color:var(--ok);color:var(--ok)}
.pzslot.ng{border-color:var(--ng);color:var(--ng)}
.pzkeys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.pzk{
  min-width:44px;height:50px;padding:0 10px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  font-size:21px;font-weight:900;font-family:inherit
}
.pzk:active{transform:translateY(2px)}
.pzk.used{opacity:.22;pointer-events:none}
.gmend{
  background:var(--primary-soft);border:1.5px solid var(--primary);border-radius:var(--radius);
  padding:20px;text-align:center;margin-top:14px
}
.gmend .big{font-size:40px;font-weight:900;letter-spacing:-2px;color:var(--primary);line-height:1.1}

/* 연속 기록 (불꽃) */
.streak{
  display:flex;align-items:center;gap:14px;cursor:pointer;
  background:linear-gradient(135deg,#FFF1E0,#FFE0C2);border:1px solid #F5CFA6;
  border-radius:var(--radius);padding:15px 17px;margin-bottom:12px
}
html[data-theme="high"] .streak{background:linear-gradient(135deg,#2A2018,#332618);border-color:#4A3A22}
.streak:active{transform:scale(.99)}
.streak .fire{font-size:38px;line-height:1;filter:saturate(1.1)}
.streak .fire.off{filter:grayscale(1);opacity:.45}
.streak .n{font-size:27px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.streak .n small{font-size:15px;font-weight:800;margin-left:2px}
.streak .msg{font-size:12.5px;font-weight:700;color:var(--sub);margin-top:2px}
.streak .go{margin-left:auto;font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.skrow{display:flex;align-items:center;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line)}
.skrow:last-child{border-bottom:0}
.skrow .rk{min-width:30px;font-size:14px;font-weight:900;color:var(--sub);text-align:center}
.skrow .nm{flex:1;font-size:16px;font-weight:700}
.skrow .st{font-size:15px;font-weight:900;white-space:nowrap}
.skrow.me{background:var(--primary-soft);border-radius:11px;padding-left:9px;padding-right:9px}
.skrow.me .nm{color:var(--primary)}
.skrow.zero .st{color:var(--sub);font-weight:700}
.hwcard{margin-bottom:10px}
/* 숙제 한 줄 */
#hwBox .hwrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--line);
  border-radius:15px;padding:11px 12px;margin-bottom:8px;
  font-family:inherit;color:var(--text);box-shadow:0 2px 8px rgba(120,70,30,.06)}
#hwBox .hwrow:active{transform:scale(.99)}
.hwmid{flex:1;min-width:0}
.hwline1{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwline1 i{font-style:normal;font-size:13px;font-weight:700;color:var(--sub);margin-left:5px}
.hwline2{display:flex;align-items:center;gap:6px;margin-top:4px;
  font-size:12px;font-weight:700;color:var(--sub);flex-wrap:wrap}
.hwgo{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  flex:0 0 auto;padding-left:2px}
html[data-theme="high"] #hwBox .hwrow{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hwcard.done{opacity:.62}
.hwdone{margin:2px 0 16px;font-size:13px;font-weight:700;color:var(--ok,#22A06B);
  text-align:center;opacity:.85}
.hwclear{text-align:center;padding:20px 14px;margin-bottom:16px}
.hwclear-t{font-size:19px;font-weight:900;color:var(--ok,#22A06B);margin-bottom:4px}
.hwtitle{font-size:17px;font-weight:800;letter-spacing:-.3px}
.pill.note{background:#7C5CFF;color:#fff}
.pill.ok{background:var(--ok);color:#fff}
.pill.ng{background:var(--ng);color:#fff}

/* 상단 바 */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.top .who{font-size:13px;color:var(--sub)}
.iconbtn{background:transparent;color:var(--sub);font-size:13px;padding:6px 10px;border-radius:10px;font-weight:700}
/* ===== 시험 탭 ===== */
/* ===== 유치부 화면 ===== */
.kidwrap{font-family:'Jua','Gowun Dodum',var(--font);}
.kidtop{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.kpill{display:flex;align-items:center;gap:6px;background:var(--card);
  border:2px solid var(--line);border-radius:99px;padding:8px 13px;font-size:17px;font-weight:900}
.kidhi{display:flex;align-items:center;gap:13px;background:var(--card);
  border:2px solid var(--line);border-bottom-width:5px;border-radius:26px;padding:14px 16px}
.kidhi b{display:block;font-size:20px;font-weight:400;line-height:1.3}
.kidhi i{display:block;font-style:normal;font-size:14px;color:var(--sub);margin-top:4px}
.kidpath{display:flex;flex-direction:column;align-items:center;padding:18px 0 10px}
.knode{display:flex;flex-direction:column;align-items:center;gap:7px}
.knode .ball{width:76px;height:76px;border-radius:99px;background:var(--primary);
  border:0;border-bottom:6px solid var(--primary-d);display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:#fff}
.knode.now .ball{width:84px;height:84px;border-bottom-width:7px}
.knode.now .halo{width:100px;height:100px;border-radius:99px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center}
.knode.done .ball{background:var(--primary);cursor:default}
.knode .nm{font-size:15px;color:var(--text)}
.knode.done .nm{font-size:13px;color:var(--sub)}
.kgo{background:var(--card);border:2px solid var(--primary);border-bottom-width:4px;
  border-radius:14px;padding:6px 14px;font-size:16px;color:var(--primary-d)}
.kdots{display:flex;gap:10px;margin:8px 0}
.kdots span{width:9px;height:9px;border-radius:99px;background:var(--line)}
.kidq{font-family:'Fredoka','Jua',var(--font);font-weight:600;font-size:46px;letter-spacing:-1px}
.kidq.ko{font-family:'Jua','Gowun Dodum',var(--font);font-size:34px;letter-spacing:0}
.kspk{width:62px;height:62px;border:0;border-radius:99px;background:#14B8A6;
  border-bottom:5px solid #0D8276;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;color:#fff}
.klearn{background:var(--card);border:3px solid var(--line);border-bottom-width:6px;
  border-radius:26px;padding:34px 18px;margin-top:18px;text-align:center}
.klearn .en{font-family:'Fredoka','Jua',var(--font);font-weight:600;font-size:48px;
  letter-spacing:-1px;line-height:1.1}
.klearn .ko{font-size:26px;margin-top:14px}
.klearn img{width:130px;height:130px;object-fit:contain;margin-bottom:10px}
.kdot3{display:flex;gap:5px;margin-top:5px;justify-content:center}
.kdot3 i{width:8px;height:8px;border-radius:99px;background:var(--line);display:block}
.kdot3 i.on{background:var(--primary)}
.kcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kcard{background:var(--card);border:3px solid var(--line);border-bottom-width:6px;
  border-radius:24px;padding:20px 10px;min-height:118px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:22px;
  color:var(--text);cursor:pointer;text-align:center;line-height:1.25}
.kcard img{width:80px;height:80px;object-fit:contain}
.kcard .en{font-family:'Fredoka','Jua',var(--font);font-weight:600;font-size:27px;letter-spacing:-.5px}
.kcard.pick{border-color:var(--primary)}
.kcard.ok{background:#EAF7EE;border-color:#16A34A;color:#166534}
.kcard.ng{background:#FDECEC;border-color:#DC2626;color:#B91C1C}
.kcard.dim{opacity:.4}
.kbar{border-radius:30px 30px 0 0;padding:20px 18px 26px;margin:0 -16px -16px}
.kbar.ok{background:#DCF3E4;border-top:3px solid #16A34A}
.kbar.ng{background:#FDE8E8;border-top:3px solid #DC2626}
.kbar .ic{width:52px;height:52px;border-radius:99px;display:flex;align-items:center;
  justify-content:center;flex:none;color:#fff}
.kbtn{display:flex;align-items:center;justify-content:center;height:66px;border:0;
  border-radius:22px;color:#fff;font-family:inherit;font-size:24px;cursor:pointer;width:100%}
.kbtn.main{background:var(--primary);border-bottom:6px solid var(--primary-d)}
.kbtn.good{background:#16A34A;border-bottom:6px solid #0E6B31}
.kbtn.bad{background:#DC2626;border-bottom:6px solid #9C1C1C}
.kstick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kst{aspect-ratio:1/1;border-radius:22px;background:var(--card);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:30px;font-family:'Jua',var(--font)}
.kst.got{background:#FFF9E8;border-color:#F0A017}
.kst.empty{background:var(--bg2,#FAF2E9);border-style:dashed;border-color:#DCC9B5;color:#C3AC96}

/* ===== 숙제 「이어서 내기」 ===== */
.nextpick{background:var(--primary-soft);border:1.5px solid var(--primary);
  border-radius:16px;padding:14px 15px;margin:0 0 16px}
.npl{font-size:13px;font-weight:900;color:var(--primary-d);margin-bottom:11px}
.npl span{font-weight:700;color:var(--sub);font-size:11.5px;margin-left:8px}
.npcards{display:flex;flex-wrap:wrap;gap:10px}
.npcard{display:flex;align-items:center;gap:11px;flex:1 1 300px;max-width:440px;
  background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  padding:12px 14px;text-align:left;font-family:inherit;cursor:pointer}
.npcard:hover{border-color:var(--primary)}
.npcard.done{opacity:.55;cursor:default}
.npdot{width:10px;height:10px;border-radius:50%;flex:none}
.npt{flex:1;min-width:0}
.npt b{display:block;font-size:13px;font-weight:800;color:var(--sub)}
.npt em{display:block;font-style:normal;font-size:17px;font-weight:900;
  letter-spacing:-.4px;color:var(--text);margin-top:2px}
.npt i{display:block;font-style:normal;font-size:11.5px;font-weight:700;
  color:var(--sub);margin-top:3px}
.npgo{flex:none;background:var(--primary);color:#fff;font-size:12.5px;font-weight:800;
  padding:9px 14px;border-radius:99px}
.exsec{font-size:12px;font-weight:800;color:var(--sub);margin:14px 2px 8px}
.exsec:first-child{margin-top:2px}
.excard{display:block;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.excard:active{background:var(--line)}
.excard.done{opacity:.6}
.excard.done:active{background:var(--card)}
.exhead{display:flex;align-items:center;gap:10px}
.exhead b{flex:1;min-width:0;font-size:16px;font-weight:900;letter-spacing:-.4px}
.exgo{flex:0 0 auto;background:var(--primary);color:#fff;font-size:12.5px;font-weight:800;
  padding:7px 15px;border-radius:99px}
.exdone{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--ok)}
.exsub{font-size:12px;font-weight:600;color:var(--sub);margin-top:6px}
.extime{display:flex;align-items:center;gap:8px;margin-top:11px}
.extime span{font-size:11.5px;font-weight:800;background:var(--line);
  padding:5px 11px;border-radius:99px}
.extime em{font-style:normal;font-weight:900;color:var(--sub)}
.membar{display:flex;align-items:center;gap:12px;margin:0 0 12px;
  border:1.5px solid var(--primary);border-radius:14px;padding:11px 12px}
.memt{flex:1;min-width:0}
.memt b{display:block;font-size:14px;font-weight:800}
.memt i{display:block;font-size:11.5px;font-style:normal;color:var(--sub);margin-top:2px}
.membar .btn{width:auto;margin:0;padding:10px 14px;font-size:13.5px;flex:0 0 auto}
.setbox{padding:2px 2px 4px}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setl{flex:1;min-width:0}
.setl b{display:block;font-size:14.5px;font-weight:800}
.setl i{display:block;font-size:12px;color:var(--sub);font-style:normal;margin-top:3px;line-height:1.45}
.setr{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.setr input{width:88px;text-align:right;font-size:16px;font-weight:800;
  padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
.setr span{font-size:13px;font-weight:700;color:var(--sub)}
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:14px;
  letter-spacing:.3px;color:var(--text);background:var(--line);
  padding:4px 10px;border-radius:99px;white-space:nowrap}
.clock.soon{color:#fff;background:#DC2626}   /* 1분 남으면 빨갛게 */
.clock.over{color:#fff;background:#DC2626;animation:시계깜빡 1s step-end infinite}
@keyframes 시계깜빡{50%{opacity:.45}}
/* 떠 있는 시계 — 스크롤해도 · 자판이 올라와도 · 가로로 돌려도 늘 오른쪽 위 (「← 그만」 은 왼쪽 위).
   pointer-events:none — 시계 밑의 단추가 그대로 눌리게 */
.fixclock{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:9999;pointer-events:none;
  font-size:16px;padding:6px 12px;background:var(--card,#fff);border:1.5px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.14)}
.fixclock.soon,.fixclock.over{font-size:20px;padding:7px 14px;border-color:#DC2626}   /* 1분 남으면 크게 — 그때가 제일 중요하다 */
@media print{.fixclock{display:none !important}}
/* 시계가 떠 있는 동안 그 화면 오른쪽 위의 「가로」 단추를 시계 폭만큼 비켜 준다 — 시계 밑에 숨지 않게 */
body.fixon .screen.on .rotbtn{margin-right:118px}
.rotbtn{margin-left:auto;white-space:nowrap;
  border:1.5px solid var(--line);background:transparent;color:var(--text);
  font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:99px;min-width:54px}
.rotbtn:active{background:var(--line)}

/* ===== 불러오는 중 표시 ===== */
.refbtn{font-size:16px;line-height:1;flex:none}
/* ↻ 앞에서 이미 오른쪽으로 밀어 두었으니, 뒤따르는 가로/세로 단추는 붙여 둔다
   (둘 다 margin-left:auto 면 남은 자리를 반씩 나눠 가져 사이가 벌어진다) */
.refbtn ~ .rotbtn{margin-left:0}
.refbtn.doing{animation:도는것 .9s linear infinite;color:var(--primary)}
@keyframes 도는것{to{transform:rotate(360deg)}}
.skl{height:13px;border-radius:7px;margin:10px 0;
  background:linear-gradient(90deg,var(--line) 25%,rgba(255,255,255,.85) 50%,var(--line) 75%);
  background-size:300% 100%;animation:빛나기 1.15s linear infinite}
@keyframes 빛나기{from{background-position:100% 0}to{background-position:-100% 0}}
.skl.w90{width:90%}.skl.w75{width:75%}.skl.w60{width:60%}.skl.w45{width:45%}
.loading{padding:22px 0;text-align:center;color:var(--sub);font-size:13px;font-weight:700}

/* 진행 바 */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}

/* 문제 화면 */
.qwrap{min-height:calc(100vh - 210px);display:flex;flex-direction:column}
.qcard{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 18px;margin:12px 0;text-align:center;min-height:190px
}
.q{font-size:var(--qsize);font-weight:800;letter-spacing:-.5px;word-break:break-word}
.qsmall{font-size:26px}
.qhint{font-size:25px;letter-spacing:3px;color:var(--sub);margin-top:14px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.qcount{font-size:12px;color:var(--sub);margin-top:6px;letter-spacing:0}
.ansline{font-size:20px;margin-top:12px;font-weight:700;min-height:28px}
.answer-in{font-size:24px;text-align:center;font-weight:700;padding:15px}

/* 3단변화 시험 */
.vform{margin-top:16px}
.vrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vrow label{flex:0 0 74px;margin:0;font-size:13px;text-align:right;color:var(--sub)}
.vin{flex:1;font-size:19px;font-weight:700;padding:13px;text-align:center}
.vin.need{border-color:var(--warn)}
.vin.ok{border-color:var(--ok);color:var(--ok)}
.vin.ng{border-color:var(--ng);color:var(--ng)}
.vmark{flex:0 0 22px;font-size:19px;font-weight:900;text-align:center}
.vmark.ok{color:var(--ok)}
.vmark.ng{color:var(--ng)}
.vans{font-size:13px;color:var(--ng);font-weight:700;margin:-4px 0 10px 84px}

/* 스크롤 시험지 */
.sheetwrap{padding-bottom:96px}
.sheettop{
  position:sticky;top:0;z-index:6;background:var(--bg);
  padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px
}
.sheettop .st1{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.sheettop .stName{font-size:14px;font-weight:800;letter-spacing:-.3px}
.sheettop .stCnt{font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.sheettop .bar{margin-top:7px}
.qrow{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 13px;margin-bottom:10px
}
.qrow .qn{
  display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border-radius:7px;background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:800;padding:0 6px
}
.qrow .qhead{display:flex;align-items:flex-start;gap:9px}
.qrow .qtext{font-size:17px;font-weight:800;line-height:1.35;word-break:break-word;flex:1}
.qrow .qsub{font-size:12px;color:var(--sub);margin-top:3px;font-weight:600;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:2px}
.qrow .sin{margin-top:9px;font-size:19px;font-weight:700;padding:12px;width:100%}
.qrow .schoices{display:grid;gap:7px;margin-top:9px}
.qrow .sch{
  padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);
  color:var(--text);font-size:15px;font-weight:600;text-align:left;width:100%
}
.qrow .sch.pick{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.qrow.done{border-color:var(--primary)}
.qrow.ok{border-color:var(--ok);background:var(--ok-soft,var(--card))}
.qrow.ng{border-color:var(--ng)}
.qrow .mark{font-size:18px;font-weight:900;margin-left:auto;line-height:1.3}
.qrow.ok .mark{color:var(--ok)}
.qrow.ng .mark{color:var(--ng)}
.qrow .sin.ok{border-color:var(--ok);color:var(--ok)}
.qrow .sin.ng{border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.qrow .sch.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.qrow .sch.ng{border-color:var(--ng);background:var(--ng);color:#fff}
.qrow .real{margin-top:7px;font-size:14px;font-weight:800;color:var(--ok)}
.qrow .blank{margin-top:7px;font-size:13px;font-weight:700;color:var(--sub)}

/* ---------- 교과서 본문 단어장 — 문장은 길어서 칸을 다르게 쓴다 ---------- */
.qrow.sent .qtext{font-size:15.5px;font-weight:700;line-height:1.55}
.qrow.sent.head .qtext{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:0;
  padding-top:3px}
.qrow.sent .qsub2{font-size:12px;font-weight:700;color:var(--sub);margin-top:4px;letter-spacing:0}
.qrow.sent .qtext b{color:var(--primary);font-weight:900}
.qrow.sent .sen{
  margin-top:9px;width:100%;font-size:16px;font-weight:600;line-height:1.5;padding:11px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);
  font-family:inherit;resize:vertical;min-height:62px;box-sizing:border-box
}
.qrow.sent .sen:focus{outline:none;border-color:var(--primary)}
.qrow.sent .sen.ok{border-color:var(--ok);color:var(--ok)}
.qrow.sent .sen.ng{border-color:var(--ng)}
.qrow.sent .sen:disabled{background:var(--card);opacity:1}
/* 문장 줄은 위아래로 쌓는다 — 스펠링 줄처럼 가로로 눕히면 문장이 쪼개진다 */
.qrow.sent{display:block}
.qrow.sent .qhead{display:flex;align-items:flex-start;gap:9px;width:auto}
.qrow.sent .sin{flex:none;width:100%;margin-top:9px}
.qrow .gapline{
  background:var(--card);border:1.5px dashed var(--line);border-radius:12px;
  padding:10px 12px;font-size:15.5px;line-height:1.7;font-weight:700
}
.qrow .gap{
  display:inline-block;min-width:76px;border-bottom:2.5px solid var(--primary);
  text-align:center;color:var(--primary);font-weight:900
}
.qrow .gap.ok{border-color:var(--ok);color:var(--ok)}
.qrow .gap.ng{border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.qrow .gap.empty{border-color:var(--ng)}
/* 문장 속에서 바로 쓰는 칸 — 따로 입력칸을 두지 않는다 */
.qrow .sin.gapin{
  display:inline-block;min-width:0;max-width:100%;margin:0 2px;padding:2px 8px;
  height:auto;min-height:0;font-size:inherit;font-weight:900;line-height:1.5;
  text-align:center;color:var(--primary);background:var(--primary-soft);
  border:0;border-bottom:2.5px solid var(--primary);border-radius:8px 8px 0 0;
  vertical-align:baseline;font-family:inherit;box-sizing:content-box
}
.qrow .sin.gapin:focus{outline:none;background:#fff;
  box-shadow:0 0 0 2px var(--primary) inset}
.qrow .sin.gapin.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft,var(--card))}
.qrow .sin.gapin.ng{color:var(--ng);border-color:var(--ng);text-decoration:line-through}
.qrow.sent .gapline{line-height:2.1}
.qrow .chipbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qrow .wch{
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:8px 11px;font-size:15px;font-weight:800;cursor:pointer;
  font-family:inherit;line-height:1.1
}
.qrow .wch.used{opacity:.3;pointer-events:none}
.qrow .madeline{
  margin-top:9px;min-height:46px;border:1.5px solid var(--primary);border-radius:12px;
  padding:9px 11px;background:var(--primary-soft);display:flex;flex-wrap:wrap;gap:6px;
  align-items:flex-start
}
.qrow .madeline .mw{
  border:none;background:var(--card);border-radius:8px;padding:6px 9px;
  font-size:15px;font-weight:800;color:var(--text);cursor:pointer;font-family:inherit
}
.qrow .madeline .ph{font-size:13px;font-weight:700;color:var(--sub);padding:5px 2px}
.qrow .spk{
  border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary);
  border-radius:12px;padding:11px 15px;font-size:15px;font-weight:900;cursor:pointer;
  font-family:inherit;margin-top:2px
}
.qrow .dw{font-weight:900}
/* 수업 짜기 (선생님) — 단계 한 줄씩 */
.sjsteps{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.sjstep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sjstep select,.sjstep input{height:38px;min-height:0;margin:0;width:auto;padding:0 8px}
.sjstep input[type=tel]{width:62px;text-align:center}
.sjstep select[data-f="단어장"]{min-width:170px}
.sjn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:13px;flex:none}
.sjkind{font-size:12px;font-weight:800;color:var(--sub);min-width:28px}
.sjkind.cum{color:var(--primary)}
.sjauto,.sjunit{font-size:12.5px;color:var(--sub)}
.sjrange{font-size:13px;font-weight:700;color:var(--sub)}
.sjmin{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.sjmin input.hand{border-color:var(--primary)}
.sjmv{display:inline-flex;gap:4px}
.sjmv button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:14px;color:var(--text);font-family:inherit}
.sjmv button:disabled{opacity:.35;cursor:default}
.sjwhy{flex:0 0 100%;font-size:12.5px;font-weight:700;color:var(--primary-d);padding-left:34px}
.gwfold{border:0;background:transparent;font:inherit;font-weight:800;font-size:inherit;color:var(--text);cursor:pointer;padding:0}
/* 넓은 규칙이 .sub 를 세로 줄로 세워서 글이 토막 난다 — 안내 글은 그냥 글로 흐르게 */
.sub.gwhelp{display:block;line-height:1.7}
.gwprev{margin-top:10px;font-size:14px;line-height:1.7}
.gwwarn{font-size:13px;font-weight:700;color:var(--ng)}
.gwr{display:inline-flex;align-items:center;gap:5px;margin:0;font-size:13px;font-weight:700;color:var(--text)}
/* 아이 — 과 단어장의 구분 고르는 줄 */
#bkKan{margin:4px 0 12px}
#bkKan .kanh{font-size:12px;font-weight:800;color:var(--sub);margin:0 2px 6px}
#bkKan .kanrow{display:flex;gap:7px;flex-wrap:wrap}
#bkKan .kanrow button{flex:1 1 28%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
#bkKan .kanrow button b{color:var(--sub);font-weight:700;margin-left:2px}
#bkKan .kanrow button.on{background:var(--primary);border-color:var(--primary);color:#fff}
#bkKan .kanrow button.on b{color:#fff}
.sjtest{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.retryrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.retryrow .btn{margin-left:auto;width:auto}
.sjlim{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.sjlim input.hand{border-color:var(--primary)}
/* 아이 — 제한 시간 안내 */
.limask{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.limask.hide{display:none}
.limbox{background:var(--card);border-radius:20px;padding:22px 20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.limt{font-size:19px;font-weight:800;margin-bottom:8px;line-height:1.4}
/* 묶음(단원·Lesson)으로 범위 고르기 */
.unitpick{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.unitpick select{width:auto;flex:1 1 110px;margin:0}
.unitpick .unitl{font-size:12px;font-weight:800;color:var(--sub)}
.sjnext{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--primary-d);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.sjnext:active{background:var(--primary-soft)}
/* 과 머리줄 — 선생님 단어장 목록 · 아이 단어장 칩 */
.tb tr.bkgrp td{background:var(--bg);font-size:12px;font-weight:800;color:var(--sub);padding-top:10px;padding-bottom:6px;letter-spacing:.02em}
.bookchips .bkgh{flex:0 0 100%;font-size:12px;font-weight:800;color:var(--sub);margin:6px 2px -2px}
.bookchips .bkgh:first-child{margin-top:0}
.sjempty{padding:16px;text-align:center;color:var(--sub);font-size:13px;border:1px dashed var(--line);border-radius:12px}
.sjfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sjbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 선생님 화면의 .btn 은 한 줄을 다 차지한다 — 짜개 안에서는 글자만큼만 */
#lsBox .sjbtns .btn,#lsBox .sjrecb .btn{width:auto;flex:none;margin:0;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;min-height:38px;height:38px}
#lsBox .sjbtns select{height:38px;min-height:0;margin:0;width:auto;padding:0 10px;font-size:14px;line-height:1.2}
.sjsum{margin-left:auto;font-size:14px;color:var(--sub)}
.sjsum b{color:var(--text)}
.sjsum.over,.sjsum.over b{color:var(--ng)}
.sjrec{border:1.5px solid var(--primary);border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--primary-soft)}
.sjwait{font-weight:700;color:var(--primary-d)}
.sjrech{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:8px}
.sjdt{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:2px}
.sjdiag ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.6}
.sjrecl{margin:0 0 12px;padding-left:22px;font-size:14px;line-height:1.8}
.sjrecl .sjm{margin-left:10px;color:var(--sub);font-weight:700}
.sjrecl i{margin-left:10px;font-style:normal;color:var(--primary-d);font-weight:700;font-size:13px}
.sjrecb{display:flex;gap:8px;flex-wrap:wrap}
/* 철자 글자 맞춰 보기 — 두 줄의 이름표와 글자 칸 너비를 같게 해서 글자가 위아래로 맞닿는다 */
.ltrow{display:flex;align-items:baseline;gap:8px;margin-top:7px}
.ltrow + .ltrow{margin-top:2px}
.ltk{flex:none;width:3.6em;font-size:12px;font-weight:800;color:var(--sub)}
.real.ltrow .ltk{color:var(--ok)}
.ltw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;font-weight:800;white-space:pre}
.lc{display:inline-block;width:1.2ch;text-align:center;font-style:normal}
.ltrow.mine .lc{color:var(--text)}
.ltrow .lc.ng{color:var(--ng)}
.ltrow .lc.more{text-decoration:line-through}
.ltrow .lc.lack{color:var(--ng);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.qrow .spk + .sin{margin-top:8px}
/* 틀린 것 3번 쓰기 */
.c3ko{font-size:17px;font-weight:800;color:var(--sub);margin-top:10px}
.c3en{font-size:34px;font-weight:900;letter-spacing:.02em;margin:6px 0 10px;word-break:break-all}
.c3say{border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary);border-radius:12px;
  padding:8px 14px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer}
.c3dots{display:flex;justify-content:center;gap:10px;margin:16px 0 12px}
.c3dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.c3dots i.on{background:var(--ok);border-color:var(--ok)}
.c3in{font-size:22px;text-align:center;font-weight:800}
.c3in.ng{border-color:var(--ng)}
.c3msg{min-height:24px;margin:10px 0 12px;font-size:14px;font-weight:700;color:var(--sub)}
.c3msg .ltrow{justify-content:center}
.c3big{font-size:24px;font-weight:900}
.qrow .dw.miss{color:var(--ng);text-decoration:underline;text-decoration-style:wavy}
.qrow .memo{margin-top:6px;font-size:12px;font-weight:700;color:var(--sub)}
.sheetbar{
  position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.sheetbar .inner{max-width:560px;margin:0 auto}
.sheetbar .left{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:7px;text-align:center}
.sheetsum{
  background:var(--primary-soft);border:1.5px solid var(--primary);border-radius:14px;
  padding:13px;text-align:center;margin-bottom:12px
}
.sheetsum b{font-size:26px;font-weight:900;color:var(--primary)}
.sheetsum span{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}

.choices{display:grid;gap:10px}
.choice{
  padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
  color:var(--text);font-size:17px;font-weight:600;text-align:left;width:100%
}
.choice:active{background:var(--primary-soft)}
.choice.correct{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.wrong{background:var(--ng);color:#fff;border-color:var(--ng)}

/* 콤보 / 점수 */
.hud{display:flex;gap:14px;align-items:center;justify-content:flex-end;font-size:13px;font-weight:800}
.hud > span:empty{display:none}
.combo{color:var(--primary);transition:transform .15s}
.combo.pop{transform:scale(1.5)}
.timer{font-variant-numeric:tabular-nums}
.timer.warn{color:var(--ng)}

.flash{cursor:pointer;user-select:none}
.flip{font-size:15px;color:var(--sub);margin-top:14px}

/* 결과 */
.score{font-size:66px;font-weight:900;letter-spacing:-3px;line-height:1}
.score small{font-size:22px;font-weight:800}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:14px}
.stat div{background:var(--primary-soft);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--sub)}

.list{margin-top:10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:0}
.item .en{font-weight:700}
.item .ko{color:var(--sub)}
.trophy{background:linear-gradient(135deg,#FFF6E0,#FFE9C2);border-color:#F0D9A8;cursor:pointer}
html[data-theme="high"] .trophy{background:linear-gradient(135deg,#1F2A3C,#25324A);border-color:#3A4A66}
.podium{background:linear-gradient(135deg,#FFF6E0,#FFE9C2);border:1px solid #F0D9A8;
  border-radius:var(--radius);padding:16px}
html[data-theme="high"] .podium{background:linear-gradient(135deg,#1F2A3C,#25324A);border-color:#3A4A66}
.podium-t{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:10px}
.podium-row{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:17px;font-weight:800}
.podium-row + .podium-row{border-top:1px solid rgba(0,0,0,.06)}
html[data-theme="high"] .podium-row + .podium-row{border-top-color:rgba(255,255,255,.08)}
.podium-row .m{font-size:22px}
.podium-row .n{flex:1}
.podium-row .s{font-size:15px;color:var(--sub)}
.podium-row.me .n{color:var(--primary)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
.colorchip{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.colorchip.on{border-color:var(--text);transform:scale(1.12)}
.hwgroup{margin-top:14px}
.hwgroup-t{font-size:13px;font-weight:800;color:var(--primary);padding-bottom:4px;border-bottom:2px solid var(--primary-soft)}
.hwgroup .sub{font-weight:600}
.hwtool{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;
  padding:8px 10px;background:var(--card2,rgba(0,0,0,.03));border-radius:10px}
.hwall{margin:0;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text)}
.hwtool .btn{width:auto;padding:7px 12px;margin:0;font-size:13px}
.hwtool .btn.off{opacity:.4}
.item.hwrow{align-items:flex-start;gap:9px}
.item.hwrow .grow{flex:1}
.hwPick{width:19px;height:19px;flex:none;margin-top:2px}
/* 시험 결과 — 한 줄을 누르면 틀린 단어 전문 */
/* 명단 — 학부모 칸 */
.pvbtn{width:auto!important;padding:5px 10px!important;margin:0!important}
.pvseen{font-size:12px;color:var(--sub,#6b7280)}
.pvnot{font-size:12px;color:#B45309;font-weight:700}
.pvbox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--soft,#f8fafc);border-radius:12px;margin:4px 0 8px}
.pvrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pvrow>b{min-width:92px;font-size:13px}
.pvrow .btn{width:auto;margin:0;padding:7px 14px}
.pvurl{flex:1;min-width:240px;margin:0;font-size:12px}
.pvsay{flex:1;min-width:240px;margin:0}
.wmemo{padding:8px 14px 12px;font-size:13px;line-height:1.6;background:var(--soft,#f8fafc);border-radius:10px;margin:0 6px 6px}
/* 숙제 시간 — 「자동」/「직접」 표시, 연습이면 흐리게, 목록의 「⏱ 5분 / 8분 ✎」 */
.tsrc{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;background:var(--line,#e5e7eb);color:var(--sub,#6b7280);margin-left:2px;vertical-align:1px}
.tsrc.hand{background:#FEF3C7;color:#92400E}
.tdim{opacity:.4}
.tmbtn{border:1px solid var(--line,#e5e7eb);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:inherit;cursor:pointer;white-space:nowrap}
.tmbox{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--soft,#f8fafc);border-radius:10px;margin:4px 0 8px}
.tmbox .tmf{display:flex;align-items:center;gap:4px;margin:0;font-size:13px;font-weight:700}
.tmbox input{width:58px;padding:6px 8px;margin:0}
.tmbox .btn{width:auto;margin:0;padding:7px 14px}
.setnote{max-width:520px;padding:4px 2px 16px}
.item.hwediting{display:block;padding:0}
.hwedit{padding:12px 11px;margin:8px 0;border:2px solid var(--primary);border-radius:12px;background:var(--bg)}
.hwedit label{font-size:12px}
.hwedit .btn{margin:0}
/* ===================== 선생님 화면 (데스크탑) ===================== */
body.desk{overflow-x:hidden}
body.desk #app{max-width:none;margin:0;padding:0}
body.desk .screen:not(#s-teacher){display:none !important}

.tshell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;
  background:var(--bg);color:var(--text)}

.tside{background:var(--card);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px}
.tbrand{font-size:16px;font-weight:900;letter-spacing:-.4px;padding:0 8px 6px}
.tbrand #tAcademy{display:block;font-size:10.5px;font-weight:800;letter-spacing:2.6px;
  color:var(--primary);margin-bottom:5px}
.tbrand small{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-top:2px}
/* ===== 선생님 — 오늘 할 일 단추 ===== */
/* ===== 숙제 내주기 — 한 줄 폼 ===== */
.hwbar{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.hwbar .ff{display:flex;flex-direction:column;gap:6px}
.hwbar .ff.hide{display:none}
.hwbar .ff > label{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.3px;margin:0}
.hwbar .ff select,.hwbar .ff input[type=date],.hwbar .ff input[type=tel]{margin:0;height:44px}
.hwbar .ff .btn{height:44px;padding:0 18px}
.hwbar .fnote{height:44px;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.hwbar .lesw{font-size:11px}
.rchips{display:flex;gap:5px;flex-wrap:wrap}
.txpick > label{display:block;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.3px;margin:0 0 7px}
.txlist{display:flex;flex-wrap:wrap;gap:7px}
.txbox{position:relative;margin:0;display:inline-flex}
.txbox input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.txbox span{display:flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;
  border:1.5px solid var(--line);border-radius:11px;background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.txbox span .dot{width:7px;height:7px;border-radius:50%;flex:none;font-style:normal}
.txbox input:checked + span{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}
.txbox input:checked + span .dot{background:#fff!important}
.txbox input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.rchips label{position:relative;margin:0;display:inline-flex}
.rchips input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;
  opacity:0;cursor:pointer;z-index:1}
.rchips span{display:flex;align-items:center;justify-content:center;height:44px;padding:0 12px;
  border:1.5px solid var(--line);border-radius:11px;background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.rchips input:checked + span{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}
.rchips input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.hwsub{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:12px}
.hwsub .sub{font-size:12px}
.againbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.agl{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--sub)}
.agchip{display:flex;align-items:center;gap:7px;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}
.agchip:hover{background:var(--primary-soft);border-color:var(--primary)}
.agchip b{font-weight:900}
.agchip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.againbar .sub{margin-left:auto;font-size:11.5px}
.tacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tacts .btn{box-shadow:none}
.tacts .warnbtn{border-color:#F3B4B4;color:#C0392B;background:#FEF4F4}
.tacts .warnbtn:hover{background:#FDE9E9}

/* ===== 선생님 — 안 낸 학생 카드 ===== */
.mlist{display:flex;flex-direction:column}
.mcard{display:flex;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line)}
.mcard:last-child{border-bottom:0}
.mn{width:34px;height:34px;flex:none;border-radius:11px;background:#FDE4E4;color:#C0392B;
  font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mh .name{font-size:15px;font-weight:900}
.mh .muted{font-size:11.5px;font-weight:600}
.mcnt{margin-left:auto;font-size:11.5px;font-weight:800;color:#C0392B}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{padding:4px 9px;border-radius:7px;background:var(--primary-soft);color:var(--primary-d);
  font-size:11.5px;font-weight:700}
.mchip.fail{background:#FDE4E4;color:#C0392B}
.mchip.off{background:var(--line);color:var(--sub)}
.mact{display:flex;gap:7px}
.mact .btn{width:auto;margin:0;padding:6px 12px;font-size:12px}
.tnav{margin-top:14px;display:flex;flex-direction:column;gap:3px}
.tnav-h{margin:14px 12px 4px;padding-top:12px;border-top:1px solid var(--line);
  font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--sub)}
.tnav .tnav-h + button, .tnav-h ~ button{font-size:13px;font-weight:600;padding:8px 12px}
.tnav .tnav-h ~ button.on{font-weight:800}
.tnav button{display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:transparent;color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;
  padding:10px 12px;border-radius:10px;line-height:1.2}
.tnav button:hover{background:var(--primary-soft)}
.tnav button.on{background:var(--primary);color:#fff}
.tnav button.on .nbadge{background:rgba(255,255,255,.28);color:#fff}
.nbadge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary-d)}
.nbadge.warn{background:#FDE4E4;color:#C0392B}
.tside-f{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.tside-f button{width:100%;background:transparent;color:var(--sub);font-family:inherit;
  font-size:13px;font-weight:700;padding:9px;border-radius:9px;text-align:left}
.tside-f button:hover{background:var(--primary-soft);color:var(--text)}

.tmain{padding:22px 26px 60px;min-width:0}
.thead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.ttitle{font-size:22px;font-weight:900;letter-spacing:-.5px}
.ttitle small{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-top:3px;letter-spacing:0}
.thead .row{flex:none}

.tbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.tbar .f{min-width:150px}
.tbar label{font-size:11.5px;margin:0 0 3px 2px}
.tbar input,.tbar select{padding:8px 11px;font-size:13.5px;border-radius:9px;margin:0}
.tbar .btn{width:auto;padding:9px 15px;font-size:13.5px;margin:0;border-radius:9px}
.tbar .sub{font-size:12.5px;padding-bottom:9px}
.tbar > label{padding-bottom:9px;white-space:nowrap}
.tbar input[type=checkbox]{margin-right:6px}
.tmain .btn{font-size:14px;padding:11px 18px;border-radius:10px;box-shadow:none}
.tmain .btn.sm{padding:9px 15px;font-size:13.5px}
.tmain .panel-b .btn{width:100%}
.tmain .tbar .btn{width:auto}
.hwall{margin:0;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  font-weight:700;color:var(--text);white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.kpi .k{font-size:12px;font-weight:800;color:var(--sub)}
.kpi .v{font-size:29px;font-weight:900;line-height:1.15;margin-top:5px;letter-spacing:-1px}
.kpi .v small{font-size:14px;font-weight:800;margin-left:2px}
.kpi .d{font-size:11.5px;color:var(--sub);margin-top:2px}
.kpi.alert{border-color:var(--ng);box-shadow:inset 3px 0 0 var(--ng)}
.kpi.alert .v{color:var(--ng)}
.kpi.alert .k{color:var(--ng);opacity:.9}

.cols{display:grid;gap:16px;align-items:start}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.c37{grid-template-columns:340px 1fr}
.cols.c73{grid-template-columns:1fr 360px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.panel + .panel{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h b{font-size:14.5px;font-weight:800}
.panel-h .sub{font-size:12px}
.panel-h .btn{width:auto;padding:6px 12px;font-size:12.5px;margin:0;border-radius:8px}
.panel-b{padding:14px 16px}
.panel-b > :first-child{margin-top:0}

.tscroll{overflow:auto;max-height:62vh}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{position:sticky;top:0;z-index:2;background:var(--card);
  text-align:left;font-size:11.5px;font-weight:800;color:var(--sub);
  letter-spacing:.4px;padding:11px 14px;border-bottom:2px solid var(--line);
  white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.tb td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
/* 한 줄 걸러 아주 옅게 — 눈이 가로로 미끄러지지 않게 */
.tb tbody tr:nth-child(even) td{background:rgba(127,140,170,.055)}
.tb tbody tr:hover td{background:var(--primary-soft)}
.tb tbody tr:last-child td{border-bottom:0}
.tb .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.tb td.num{font-size:13.5px}
.tb .nw{white-space:nowrap}
.tb .ctr{text-align:center;white-space:nowrap}
.tb .w{width:1%}
.tb .name{font-weight:800}
.tb .muted{color:var(--sub);font-size:12.5px}
.tb input[type=checkbox]{transform:scale(1.1);margin:0}

.chipc{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chipc .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.sc{font-weight:900;font-variant-numeric:tabular-nums}
.sc.good{color:var(--ok)} .sc.mid{color:var(--warn)} .sc.bad{color:var(--ng)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;border-radius:3px}
.empty{padding:34px 16px;text-align:center;color:var(--sub);font-size:13.5px}
.tform label{font-size:11.5px}
.tform input,.tform select,.tform textarea{padding:9px 12px;font-size:13.5px;border-radius:9px}
.tform .btn{border-radius:10px}
.miniform{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (max-width:980px){
  .tshell{grid-template-columns:1fr}
  .tside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .tnav{flex-direction:row;flex-wrap:wrap;margin-top:0}
  .tnav-h{display:none}
  .tnav .tnav-h ~ button{font-size:14px;font-weight:700;padding:10px 12px}
  .tside-f{margin:0;padding:0;border:0}
  .tmain{padding:16px 14px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols.c2,.cols.c37,.cols.c73{grid-template-columns:1fr}
}

.pill.miss{background:#FDE4E4;color:#C0392B;cursor:pointer}
.pill.bochung{background:#EDE9FE;color:#6D28D9}
.pill.fail{background:#FEE2E2;color:#B91C1C;border:1px solid #FCA5A5}
.pill.siheom{background:#FEF3C7;color:#92400E}
.pill.off{background:#E5E7EB;color:#6B7280}
.tb tr.grow2.many{cursor:pointer}
.tb tr.grow2.many:hover{background:var(--primary-soft)}
.tb tr.offrow td{opacity:.45}
.tb tr.offrow .pill.off{opacity:1}
/* 학부모 화면에서만 감춘 숙제 — 지운 게 아니라 흐리게만 (학생 화면엔 그대로 나간다) */
.tb tr.prhide td{opacity:.5}
.pill.prhide{background:var(--line);color:var(--sub)}
.misslist{margin-top:7px;padding:8px 10px;border-radius:9px;
  background:#FDE4E4;color:#8E2A1E;font-size:12.5px;line-height:1.55}
.misslist .sub{color:#8E2A1E;opacity:.75}
.missnames{font-size:12.5px;font-weight:700;color:#C0392B;line-height:1.5}
.gbig{display:flex;align-items:flex-start;gap:11px;margin:0 0 8px;padding:12px 14px;
  border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--bg)}
.gbig:hover{border-color:var(--primary)}
.gbig.off{opacity:.45;cursor:default}
.gbig input[type=checkbox]{width:19px;height:19px;flex:none;margin:1px 0 0}
.gbig span{display:block;font-size:14px;font-weight:700;color:var(--text);line-height:1.35}
.gbig small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:2px}
.gstu td{padding:9px 14px}
.gstu.on td{font-weight:800}
.awgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.awcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.awtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.awicon{font-size:20px}
.awname{font-size:21px;font-weight:900;letter-spacing:-.6px;margin-top:10px;line-height:1.25}
.awval{font-size:14px;font-weight:800;margin-top:2px}
.awtie{margin-top:9px;padding:8px 10px;border-radius:9px;background:var(--primary-soft);
  font-size:11.5px;font-weight:700;line-height:1.5;color:var(--text)}
@media (max-width:1100px){ .awgrid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .awgrid{grid-template-columns:1fr} }
.wrow{cursor:pointer}
.wrow:active{background:var(--primary-soft)}
.wno{display:inline-block;min-width:32px;color:var(--sub);font-weight:600;font-size:12px}
.wpic{width:34px;height:34px;border-radius:9px;object-fit:contain;flex:none;
  background:var(--card);border:1px solid var(--line);margin-right:9px;vertical-align:middle}
span.wpic{display:inline-flex;align-items:center;justify-content:center;
  border-style:dashed;color:var(--sub);font-size:15px}
.wpic.big{width:78px;height:78px;border-radius:15px;margin:0}
.picbar{display:flex;align-items:center;gap:11px;margin-top:11px;
  background:var(--bg2,#F6F7F9);border-radius:12px;padding:10px 11px}
.witem{padding:12px 2px;border-bottom:1px solid var(--line)}
.witem input{font-size:15px;padding:10px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-size:11px;font-weight:800;white-space:nowrap}
td .sub{white-space:nowrap}
td.nw{white-space:nowrap}
.scroll{overflow-x:auto}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs .chip{white-space:nowrap;flex:0 0 auto}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,25,.92);color:#fff;padding:12px 18px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99
}
.toast.on{opacity:1;transform:translateX(-50%)}

.fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.fx span{position:absolute;font-size:26px;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-120px) rotate(30deg);opacity:0}}

/* ===== 하단 탭바 — 학생 화면 이동 ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;background:var(--card);border-top:1.5px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 16px rgba(120,70,30,.07)}
.tabbar.hide{display:none}
.tabbar button{flex:1 1 0;min-width:0;background:transparent;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 5px;color:var(--sub);font-family:inherit;position:relative}
.tabbar button svg{width:23px;height:23px;flex:none}
.tabbar button span{font-size:10.5px;font-weight:700;letter-spacing:-.2px}
.tabbar button.on{color:var(--primary)}
.tabbar button.on span{font-weight:900}
.tabbar .tbadge{position:absolute;top:2px;left:calc(50% + 6px);
  min-width:17px;height:17px;box-sizing:border-box;padding:0 4px;border-radius:99px;
  background:var(--ng);color:#fff;font-size:10px;font-weight:900;line-height:17px;
  text-align:center;font-style:normal}
.tabbar .tbadge.hide{display:none}
body.hastab #app{padding-bottom:96px}
html[data-theme="high"] .tabbar{box-shadow:0 -4px 16px rgba(0,0,0,.28)}
@media print{ .tabbar{display:none!important} }

/* ===== 홈 머리 ===== */
.hhead{display:flex;align-items:center;gap:2px;padding:4px 2px 12px}
.hwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hwho b{font-size:19px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.hwho span{font-size:11.5px;font-weight:600;color:var(--sub)}

/* ===== 오늘 한 줄 ===== */
/* ===== 알림 팝업 ===== */
.noti{position:fixed;inset:0;z-index:90;background:rgba(40,25,12,.45);
  display:flex;align-items:flex-end;justify-content:center;padding:14px;
  animation:fade .18s ease}
.noti.hide{display:none}
.notibox{width:100%;max-width:492px;background:var(--card);border-radius:24px;
  padding:16px 16px 18px;box-shadow:0 -10px 40px rgba(60,30,10,.28);
  animation:notiup .22s cubic-bezier(.2,.9,.3,1)}
@keyframes notiup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.notihead{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.notiday{flex:1;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.2px}
.notix{background:transparent;border:0;cursor:pointer;font-size:15px;color:var(--sub);
  width:38px;height:38px;border-radius:50%;font-family:inherit}
.notix:hover{background:var(--primary-soft)}
.notilist{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;
  max-height:58vh;overflow:auto}
.notirow{display:flex;gap:11px;align-items:flex-start;
  background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px 13px}
.notirow .ni{width:32px;height:32px;flex:none;border-radius:11px;
  display:flex;align-items:center;justify-content:center;background:var(--primary-soft)}
.notirow .ni svg{width:17px;height:17px;stroke:var(--primary)}
.notirow .nt{flex:1;min-width:0}
.notirow .nt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.notirow .nt i{display:block;font-style:normal;font-size:12.5px;font-weight:600;
  color:var(--sub);margin-top:3px;line-height:1.5;white-space:pre-line}
.notirow.say{border-color:#F3C99B;background:#FFF6EC}
.notirow.say .ni{background:var(--primary);}
.notirow.say .ni svg{stroke:#fff}
.notirow.warn{border-color:#FCA5A5;background:#FEF2F2}
.notirow.warn .ni{background:#FEE2E2}
.notirow.warn .ni svg{stroke:#B91C1C}
.notirow.warn .nt b{color:#B91C1C}
html[data-theme="high"] .notirow.say{background:#3A2A18;border-color:#7A5B2E}
html[data-theme="high"] .notirow.warn{background:#3A1F1F;border-color:#7A3A3A}

/* 홈에 남는 공지 줄 */
.saybar{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:#FFF6EC;border:1.5px solid #F3C99B;border-radius:16px;
  padding:11px 13px;margin-bottom:12px;font-family:inherit;color:var(--text);cursor:pointer}
.saybar svg{width:17px;height:17px;flex:none;stroke:var(--primary)}
.saybar b{flex:1;min-width:0;font-size:13.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saybar span{font-size:11.5px;font-weight:700;color:var(--primary);flex:none}
html[data-theme="high"] .saybar{background:#3A2A18;border-color:#7A5B2E}

.tdcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;
  padding:14px 16px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:11px;
  box-shadow:0 2px 10px rgba(120,70,30,.06)}
.tdcard .tline{display:flex;align-items:center;gap:8px}
.tdcard .tline svg{width:17px;height:17px;flex:none}
.tdcard .tmsg{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdcard .tgo{background:transparent;border:0;cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:800;color:var(--primary);padding:4px 2px}
.tdcard .tnum{display:flex;align-items:baseline;gap:7px}
.tdcard .tnum b{font-size:34px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--primary)}
.tdcard .tnum i{font-style:normal;font-size:15px;font-weight:800}
.tdcard .tnum em{font-style:normal;margin-left:auto;font-size:12px;font-weight:700;color:var(--sub)}
.tdcard .tbar{height:9px;border-radius:99px;background:var(--line);display:flex;overflow:hidden}
.tdcard .tbar i{height:100%;flex:none;background:var(--primary);border-radius:99px;min-width:0}
.tdcard.done .tnum b{color:var(--ok,#22A06B)}
.tdcard.done .tbar i{background:var(--ok,#22A06B)}

/* ===== 지금 할 것 ===== */
.hwhero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--primary);border:0;border-radius:22px;padding:16px 18px;margin-bottom:12px;
  font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(232,101,26,.26)}
.hwhero:active{transform:scale(.99)}
.hwhero .hh{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hwhero .hk{font-size:10px;font-weight:900;letter-spacing:1.4px;color:rgba(255,255,255,.78)}
.hwhero .ht{font-size:18.5px;font-weight:900;letter-spacing:-.5px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwhero .hd{font-size:12px;font-weight:700;color:rgba(255,255,255,.85)}
.hwhero .hp{width:52px;height:52px;flex:none;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center}
.hwhero .hp svg{width:22px;height:22px;fill:var(--primary);stroke:none}
html[data-theme="high"] .hwhero{box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* ===== 틀렸던 단어 ===== */
.bellbar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:13px 14px;margin-top:12px;font-family:inherit;cursor:pointer;color:var(--text)}
.bellbar:active{transform:scale(.99)}
.bellbar .bi{width:34px;height:34px;flex:none;border-radius:11px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center}
.bellbar .bi svg{width:18px;height:18px;stroke:var(--primary)}

/* ================================================================

   글은 싣지 않는다 — 일꾼이 깨어나서 공지를 직접 물어본다.

function b64url_(buf){
  var a=new Uint8Array(buf), t='';
  for(var i=0;i<a.length;i++) t+=String.fromCharCode(a[i]);

  var p='='.repeat((4 - s.length % 4) % 4);

  for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i);

  var jwk = JSON.parse(비밀키글);

  var 속 = b64url_(new TextEncoder().encode(JSON.stringify({

    .then(function(k){

  if(상태===401||상태===403) return {ok:false, 말:상태+' · 열쇠가 안 맞음', 고칠것:'열쇠'};
  if(상태===404||상태===410) return {ok:false, 말:상태+' · 그 휴대폰 구독이 끝남', 죽음:true};
  if(상태===413) return {ok:false, 말:'413 · 글이 너무 김'};
  if(상태===429) return {ok:false, 말:'429 · 너무 자주 보냄'};
  return {ok:false, 말:상태+(글?' · '+String(글).slice(0,60):'')};
}
/* 고른 사람들에게 알림을 쏜다 → {보냄, 실패, 죽은주소[], 줄[]}
   표(JWT)는 여기서 만들고, 실제로 보내는 일은 앱스 스크립트가 한다.
   브라우저에서 알림 서버로 바로 보내면 CORS 로 막히기 때문이다. */
function 알림쏘기(구독들, 열쇠){
  /* 표는 '알림 서버 주소(origin)' 마다 하나면 된다 — 한 번만 만들어 돌려 쓴다 */
  var 집들 = {};
  구독들.forEach(function(sub){
    if(String(sub.주소).startsWith('fcm:')) return;
    try { 집들[new URL(sub.주소).origin] = 1; } catch(e){}
  });
  var 이름들 = Object.keys(집들);
  if(!구독들.length) return Promise.resolve({보냄:0, 실패:0, 죽은주소:[], 줄:[]});

  return Promise.all(이름들.map(function(집){
    return 알림표_(열쇠.비밀키, 집).then(function(표){ return {집:집, 표:표}; });
  })).then(function(표들){
    var 표맵 = {};
    표들.forEach(function(x){ 표맵[x.집] = x.표; });

    var 보낼것 = [], 짝 = [];
    구독들.forEach(function(sub){
      if(String(sub.주소).startsWith('fcm:')) { 보낼것.push({주소:sub.주소}); 짝.push(sub); return; }
      var 집 = '';
      try { 집 = new URL(sub.주소).origin; } catch(e){ return; }
      보낼것.push({ 주소:sub.주소, 표:표맵[집], 공개키:열쇠.공개키 });
      짝.push(sub);
    });

    return api('푸시전송', T.pw, 보낼것).then(function(r){
      var 답 = (r && r.줄) || [];
      var 보냄=0, 실패=0, 죽음=[], 줄=[];
      답.forEach(function(v, i){
        var sub = 짝[i] || {};
        var t = 알림탈_(v.상태, v.글);
        if(t.ok) 보냄++; else { 실패++; if(t.죽음) 죽음.push(sub.주소); }
        줄.push({ 이름:sub.이름, 기기:짧은기기_(sub.기기), ok:t.ok, 말:t.말,
                  고칠것:t.고칠것, 원문:t.원문 });
      });
      return {보냄:보냄, 실패:실패, 죽은주소:죽음, 줄:줄};
    });
  });
}
/* 기기 글을 짧게 — 아이폰 / 안드로이드 / 컴퓨터 */
function 짧은기기_(t){
  t = String(t||'');
  if(/iPhone|iPad|iPod/i.test(t)) return '아이폰';
  if(/Android/i.test(t)) return '안드로이드';
  if(!t) return '';
  return '컴퓨터';
}
/* 공지 하나를 알림으로 보내기 (이름들을 주면 그 학생들만) */
function 공지알림보내기(이름들){
  /* 미리보기에서는 진짜로 쏘지 않는다 — 몇 명에게 갈지만 보여 준다 */
  if(!GAS){
    return api('구독목록', T.pw, 이름들||[]).then(function(r){
      var 구독=(r&&r.구독)||[];
      return {보냄:구독.length, 실패:0, 죽은주소:[], 대상:구독.length,
        줄: 구독.map(function(x){
          return {이름:x.이름, 기기:짧은기기_(x.기기), ok:true, 말:'보냄'};
        })};
    });
  }
  return api('구독목록', T.pw, 이름들||[]).then(function(r){
    var 구독 = (r && r.구독) || [];
    if(!구독.length) return {보냄:0, 실패:0, 죽은주소:[], 대상:0};
    var 웹구독 = 구독.some(function(sub){ return !String(sub.주소).startsWith('fcm:'); });
    var 준비 = 웹구독 ? api('푸시열쇠', T.pw).then(function(k){
      if(!k || !k.ok || !k.공개키 || !k.비밀키) throw new Error('열쇠 없음');
      return k;
    }) : Promise.resolve({});
    return 준비.then(function(k){ return 알림쏘기(구독, k); }).then(function(결과){
      결과.대상 = 구독.length;
      if(결과.죽은주소.length) api('구독지우기', T.pw, 결과.죽은주소).catch(function(){});
      return 결과;
    });
  });
}

/* 안 낸 숙제를 '학생' 기준으로 묶는다 — 누구에게 말할지가 먼저 보이게 */
function 밀린사람들(숙제들){
  var 사람={}, 차례=[];
  (숙제들||[]).forEach(function(h){
    (h.안한사람||[]).forEach(function(n){
      var k=n;
      if(!사람[k]){ 사람[k]={이름:n, 건:[], 모자람:0, 행들:[]}; 차례.push(사람[k]); }
      var p=사람[k];
      p.건.push(h);
      if((h.모자란사람||[]).indexOf(n)>-1) p.모자람++;
      if(h.행) p.행들.push(h.행);
    });
  });
  차례.sort(function(a,b){ return b.건.length-a.건.length || (a.이름<b.이름?-1:1); });
  return 차례;
}
/* 한 사람 카드 — 밀린 숙제를 칩으로 보여 주고 그 자리에서 보충을 낸다 */
function 밀린줄(p, 최대){
  최대 = 최대 || 3;
  var 칩들 = p.건.slice(0,최대).map(function(h){

    return '<span class="mchip'+(모?' fail':'')+'">'+esc(h.단어장)+' '+esc(선생님범위글_(h.단어장,h.시작,h.끝))+
      (모 ? ' · '+(h.종류==='보충'?'보충':'점수 모자람') : (시험인가_(h)?' · 시험':''))+'</span>';
  }).join('');
  var 더 = p.건.length>최대 ? '<span class="mchip off">외 '+(p.건.length-최대)+'건</span>' : '';
  return '<div class="mcard">'+
    '<div class="mn">'+p.건.length+'</div>'+

      '<div class="mh"><span class="name">'+esc(p.이름)+'</span>'+

      '<div class="mchips">'+칩들+더+'</div>'+
      '<div class="mact"><button class="btn line sm" data-bochung="'+esc(p.이름)+'">'+
        '보충으로 다시 내기</button></div>'+

}
/* 카드의 '보충으로 다시 내기' — 그 학생이 안 낸 것을 오늘 보충으로 다시 낸다 */

        }).then(function(r){

        }).catch(function(){}).then(function(){

          사이드배지(); drawTab();

/* 지난번과 같게 — 최근에 낸 숙제를 그대로 다시 고른다 */
/* ================================================================
   진도 이어가기 — 단어장마다 「어디까지 냈는지」 를 보고 다음 레슨을 잡아 준다
   · 그 단어장으로 낸 숙제 중 가장 뒤 번호가 지금까지의 진도다
   · 유형과 종류는 그 단어장으로 마지막에 낸 것을 그대로 따라간다
================================================================ */
function 책진도_(단어장, 전체, 목록){
  var 총 = 0, 묶음 = 10;
  (목록 || []).forEach(function(x){
    if(x.이름 === 단어장){ 총 = Number(x.개수) || 0; 묶음 = Number(x.레슨) || 10; }
  });
  var 마지막끝 = 0, 최근 = null;
  (전체 || []).forEach(function(h){
    if(h.단어장 !== 단어장) return;
    /* 진도는 평소 숙제(당일·기한)로만 센다.
       보충은 지난 데를 다시 하는 것이고, 시험은 여러 레슨을 한꺼번에 묶으므로
       이것들로 진도를 밀면 레슨이 건너뛰어진다. */
    if(h.종류 === '보충' || 시험인가_(h)) return;
    var 끝 = Number(h.끝) || 0;
    if(끝 > 마지막끝) 마지막끝 = 끝;
    최근 = h;                                  /* 시트 차례대로라 마지막이 가장 최근 */
  });
  if(!최근) return null;
  if(마지막끝 > 총) 마지막끝 = 총;              /* 단어장이 줄었을 때를 대비 */
  var 다음시작 = 마지막끝 + 1;
  var 끝났나 = !총 || 다음시작 > 총;
  return {
    단어장: 단어장, 총: 총, 묶음: 묶음,
    지난끝: 마지막끝, 최근: 최근, 끝났나: 끝났나,
    시작: 끝났나 ? 0 : 다음시작,
    끝: 끝났나 ? 0 : Math.min(총, 다음시작 + 묶음 - 1)
  };
}

function 진도들_(전체, 목록){
  var 본것 = {}, 결과 = [];
  (전체 || []).forEach(function(h){
    if(본것[h.단어장]) return;
    본것[h.단어장] = 1;
    var p = 책진도_(h.단어장, 전체, 목록);
    if(p) 결과.push(p);
  });
  return 결과;
}

function 진도줄(전체, 목록){
  var 것들 = 진도들_(전체, 목록);
  if(!것들.length) return '';

    '<div class="npcards">'+

        ? '지난번 레슨 ' + (p.지난끝 / p.묶음) + '까지'
        : '지난번 ' + p.지난끝 + '번까지';

function 지난숙제줄(전체){
  var 본것={}, 목록=[];
  (전체||[]).slice().reverse().forEach(function(h){
    var k=[h.단어장,h.시작,h.끝,h.유형,h.종류].join('|');
    if(본것[k]) return;
    본것[k]=1; 목록.push(h);

  목록 = 목록.slice(0,4);
  if(!목록.length) return '';
  return '<div class="againbar">'+
    '<span class="agl">지난번과 같게</span>'+
    목록.map(function(h,i){

      return '<button class="agchip" data-again="'+i+'">'+
        (c?'<span class="dot" style="background:'+c+'"></span>':'')+
        esc(h.단어장)+' <b>'+esc(선생님범위글_(h.단어장,h.시작,h.끝))+'</b> · '+esc(h.유형)+
        ' · '+esc(h.종류==='당일'?'오늘':h.종류)+'</button>';

    '<span class="sub">누르면 위 칸이 그대로 채워집니다</span>'+

}
/* 칩을 누르면 폼을 그 값으로 채운다 */
function 지난숙제손잡이(전체){
  var 본것={}, 목록=[];
  (전체||[]).slice().reverse().forEach(function(h){
    var k=[h.단어장,h.시작,h.끝,h.유형,h.종류].join('|');
    if(본것[k]) return; 본것[k]=1; 목록.push(h);
  });
  목록=목록.slice(0,4);
  qsa('[data-again]').forEach(function(btn){
    btn.onclick=function(){
      var h=목록[+btn.dataset.again]; if(!h) return;
      if($('hwBook')) $('hwBook').value=h.단어장;
      if($('hwFrom')) $('hwFrom').value=h.시작;
      if($('hwTo'))   $('hwTo').value=h.끝;
      if($('hwType')) $('hwType').value=h.유형;
      qsa('input[name=hwKind]').forEach(function(r){
        r.checked = (r.value===h.종류);
        if(r.checked && r.onchange) r.onchange();
      });
      if($('hwDue') && (h.종류==='기한'||시험인가_(h))) $('hwDue').value=h.마감일||'';
      if(typeof 숙제레슨다시==='function') 숙제레슨다시();
      toast('“'+h.단어장+' '+선생님범위글_(h.단어장,h.시작,h.끝)+'”으로 채웠습니다');
    };
  });
}

function 구분칩(t){
  if(t.무효) return '<span class="pill off">시험 무름</span>';
  if(t.재시험) return '<span class="pill note">오답노트</span>';
  if(t.구분==='시험') return '<span class="pill siheom">시험</span>';
  if(t.구분==='보충') return '<span class="pill bochung">보충</span>';
  return t.숙제 ? '<span class="pill hw">숙제</span>' : '<span class="muted">연습</span>';
}
function 종류칩(종류){
  if(종류==='보충') return '<span class="pill bochung">보충</span>';
  if(종류==='시험') return '<span class="pill siheom">시험</span>';
  if(종류==='당일') return '<span class="pill today">당일</span>';
  return '<span class="pill later">기한</span>';
}
function 책칩(이름){
  var c=(T.색맵||{})[이름]||'';
  return '<span class="chipc">'+(c?'<span class="dot" style="background:'+c+'"></span>':'')+
    esc(이름)+'</span>';
}
function 점수칸(n){
  var c = n>=80?'good':(n>=60?'mid':'bad');
  return '<span class="sc '+c+'">'+n+'</span>';
}
function 막대(n){
  var c = n>=80?'var(--ok)':(n>=60?'var(--warn)':'var(--ng)');
  return '<div class="bar"><i style="width:'+Math.max(2,Math.min(100,n))+'%;background:'+c+'"></i></div>';
}

function 교재맞나(값, 필터){
  var f = (필터===undefined) ? T.교재필터 : 필터;
  if(!f) return true;
  var 목록=교재목록(값);

function 교재칩(값, 최대){

    보임 += ' <span class="pill off" title="'+esc(목록.join(', '))+'">외 '+(목록.length-최대)+'</span>';
  return 보임;
}
