<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 주소(토큰)가 바깥 사이트로 새어 나가지 않게 — 전화 걸기 말고는 밖으로 나가는 링크도 없다 -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영단어학습프로그램 학부모">
<title>홍제인왕영어 학부모</title>
<link rel="manifest" href="parent-manifest.json" id="mfLink">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F6F4F1; --card:#FFFFFF; --text:#000000; --sub:#6B6660; --line:#ECE7E1;
  --accent:#FF9500; --accent-soft:#FFF1DE; --good:#16A34A; --good-soft:#E8F7EE;
  --warn:#D9480F; --warn-soft:#FFE8DC; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.hide{display:none!important}

/* 설치 안내 — 위에 작은 띠 하나. 화면을 덮지 않는다 */
.band{position:sticky;top:0;z-index:5;background:#1F1B16;color:#fff;font-size:14px;line-height:1.45;
  padding:10px 44px 10px 14px;margin:0 -16px 12px;}
.band b{color:#FFC46B}
.band .bandact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.band button.bbtn{border:0;border-radius:999px;background:var(--accent);color:#000;font-weight:800;
  font-size:14px;padding:8px 14px;cursor:pointer}
.band button.bbtn.line{background:transparent;color:#fff;border:1px solid #6B6660}
.band .bandx{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;
  color:#C9C2B9;font-size:22px;line-height:1;cursor:pointer}
.band svg{vertical-align:-4px}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 12px}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px}
.top .date{color:var(--sub);font-size:15px;font-weight:700}

.card{background:var(--card);border-radius:var(--r);padding:16px 16px 14px;margin:0 0 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-size:14px;font-weight:800;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin-top:8px}

.alert{border-radius:var(--r);padding:14px 16px;margin:0 0 12px;font-weight:800;font-size:15px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--good-soft);color:var(--good)}
.alert small{display:block;font-weight:600;font-size:13px;margin-top:3px;color:inherit;opacity:.85}

.say{background:var(--accent-soft)}
.say p{margin:0;font-size:16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}

.hw{list-style:none;margin:0;padding:0}
.hw li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hw li:first-child{border-top:0}
.hw .mk{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900}
.hw .done .mk{background:var(--good-soft);color:var(--good)}
.hw .todo .mk{background:var(--warn-soft);color:var(--warn);border:2px solid var(--warn)}
.hw .t{flex:1;min-width:0}
.hw .t b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 숙제 줄의 작은 둘째 줄 — 언제 것인지 · 언제 냈는지. 늦게 냈어도 빨갛게 하지 않는다 */
.hw .t .sub{display:block;margin-top:2px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw .t .sub small{font-size:11px;margin-left:3px}
.hw .t span{font-size:13px;color:var(--sub)}
.hw .r{flex:none;font-weight:900;font-size:15px;text-align:right}
.hw .todo .r{color:var(--warn);font-size:13px}
.hw .r em{font-style:normal;font-size:12px;font-weight:700;margin-left:1px}
/* 풀었는데 합격점을 못 넘긴 줄 — 빨갛게 하지 않는다 (어머님 화면의 빨간 글씨는 아이를 혼나게 만든다) */
.hw .again .r{color:var(--sub);font-size:13px;font-weight:700}
.hw .again .r b{color:var(--text);font-size:15px;font-weight:900}
.hw .todo.again{background:none}
.hw .again .mk{background:var(--line);color:var(--sub);border:2px solid var(--line)}
.hw .todo{background:linear-gradient(90deg,rgba(255,232,220,.55),rgba(255,232,220,0));margin:0 -16px;padding-left:16px;padding-right:16px}

.chart{width:100%;height:auto;display:block;margin:2px 0 6px}
.tests{list-style:none;margin:0;padding:0}
.tests li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tests li:first-child{border-top:0}
.tests .d{color:var(--sub);width:42px;flex:none;font-weight:700}
.tests .n{flex:1;min-width:0;overflow-wrap:anywhere}
.tests .s{font-weight:900;flex:none}
.tests .yet .s{color:var(--accent);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.chip em{font-style:normal;color:var(--accent);font-size:13px;margin-left:4px}

.prog{margin:8px 0 12px}
.prog:last-child{margin-bottom:2px}
.prog .pt{display:flex;justify-content:space-between;font-weight:800;font-size:15px;gap:8px}
.prog .pt span{color:var(--sub);font-weight:700;flex:none}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

.foot{text-align:center;color:var(--sub);font-size:14px;padding:14px 4px 4px;line-height:1.7}
.foot b{color:var(--text)}
.foot a{color:var(--text);font-weight:800}

.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:#000;font-weight:900;
  font-size:16px;padding:14px;cursor:pointer;margin:4px 0 12px}
.btn.line{background:var(--card);border:1px solid var(--line)}
.msg{text-align:center;padding:36px 18px}
.msg .big{font-size:40px;line-height:1}
.msg p{margin:12px 0 0;font-weight:800;font-size:16px}
.msg small{display:block;color:var(--sub);margin-top:6px;font-size:14px}

.skl{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEE9E3,#F7F3EE,#EEE9E3);background-size:200% 100%;
  animation:skl 1.2s infinite;margin:10px 0}
.w40{width:40%}.w70{width:70%}.w90{width:90%}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1F1B16;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div id="band" class="band hide" role="status"></div>
  <main id="app">
    <div class="card"><div class="skl w40"></div><div class="skl w90"></div><div class="skl w70"></div></div>
    <div class="card"><div class="skl w40"></div><div class="skl w90"></div><div class="skl w90"></div></div>
  </main>
</div>
<div id="toast"></div>
<script>

  clearTimeout(토스트시계); 토스트시계 = setTimeout(function(){ t.classList.remove('on'); }, 2200);

/* ---------- 그리기 ---------- */
function 메시지(큰, 글, 작은, 단추){
  $('app').innerHTML = '<div class="card msg"><div class="big">'+큰+'</div><p>'+esc(글)+'</p>'+

/* 점수 흐름 — 가벼운 인라인 SVG (라이브러리 없이). 오래된 것 → 최근 */

  }).join('');

/* 숙제 줄 오른쪽 — 낸 것은 점수(없으면 「냈어요」), 풀었는데 못 넘긴 것은 「68점 · 다시 하고 있어요」, 안 푼 것은 마감 글 */

/* 둘째 줄 — 낸 것 「10/7 · 밤 9:14 냈어요」, 다시 하는 것은 마지막으로 푼 때(「… 풀었어요」), 안 낸 것 「10/8 마감」.
   시각 글은 서버가 학원 시간대로 만들어 보낸다. 기록을 못 찾은 옛 숙제는 날짜만 */

/* [주소 복사] — 인앱 브라우저에서 제일 많이 쓰는 단추. clipboard 가 막혀 있으면 숨은 칸 + execCommand 로 */

  var 등록 = null;
  navigator.serviceWorker.register('parent-sw.js', {scope:'./parent.html'}).then(function(r){
    등록 = r;
    return Notification.requestPermission();
  }).then(function(p){
    if(p !== 'granted') throw new Error('거절');
    return api('푸시공개키');
  }).then(function(키){
    if(!키) throw new Error('열쇠');
    return navigator.serviceWorker.ready.then(function(r){
      return r.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:바이트_(String(키))});
    });
  }).then(function(구독){
    var j = 구독.toJSON();
    return api('구독등록', 자료.이름, {주소:j.endpoint, p256dh:(j.keys||{}).p256dh, auth:(j.keys||{}).auth}, 기기글_());
  }).then(function(){
    저장쓰기(알림열쇠, 토큰);
    일꾼에알리기_();
    toast('이제 숙제 소식을 알림으로 보내 드려요');
    알림단추();
  }).catch(function(e){
    toast(String(e && e.message) === '거절' ? '알림을 허용하지 않으셨어요. 그래도 링크로는 다 보실 수 있어요.'
                                           : '알림을 켜지 못했어요. 링크로는 그대로 다 보실 수 있어요.');
  });
}
/* 알림 일꾼에게 「어디로 묻고, 누구 것인지」 알려 둔다 — 알림이 오면 일꾼이 숙제 수를 물어본다 */
function 일꾼에알리기_(){
  try{
    if(미리보기 || !('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.controller.postMessage({무엇:'내정보', 값:{창구:창구주소, 토큰:토큰,
      주소: location.href.split('#')[0] + '#k=' + 토큰}});
  }catch(e){}
}

/* 홈 화면에서 열 때도 토큰이 따라가게 — 아이폰의 홈 화면 앱은 사파리와 저장소가 따로라
   이 기기에 적어 둔 토큰을 못 본다. 그래서 「지금 주소(토큰 포함)」 를 시작 주소로 하는 설명서를 그 자리에서 만든다.
   안드로이드는 홈 화면 앱이 브라우저와 저장소를 같이 쓰므로 파일 설명서(parent-manifest.json)를 그대로 둔다 */
(function(){
  try{
    if(!토큰 || !아이폰인가_(navigator.userAgent || '')) return;
    var 이쪽 = location.href.split('#')[0].split('?')[0], 밑 = 이쪽.replace(/[^\/]*$/, '');
    var 설명 = { name:'홍제인왕영어 학부모', short_name:'영단어학습프로그램 학부모', start_url: 이쪽 + '#k=' + 토큰, scope: 이쪽,
      display:'standalone', background_color:'#F6F4F1', theme_color:'#F6F4F1', lang:'ko',
      icons:[{src: 밑 + 'icon-192.png', sizes:'192x192', type:'image/png'}, {src: 밑 + 'icon-512.png', sizes:'512x512', type:'image/png'}] };
    $('mfLink').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(설명)));
  }catch(e){}
})();

if(!미리보기 && 'serviceWorker' in navigator && window.isSecureContext !== false){
  /* 일꾼은 미리 깔아 둔다 — 안드로이드에서 「홈 화면에 추가」 가 뜨는 데도 쓰인다. 실패해도 화면은 그대로 */
  try{ navigator.serviceWorker.register('parent-sw.js', {scope:'./parent.html'}).catch(function(){}); }catch(e){}
}
열기();
</script>
