<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숙제 체크</title>
<style id="mainStyle">
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f5f7; color: #222;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 12px; }
  .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .date { font-size: 13px; color: #666; }
  .count { font-size: 18px; font-weight: 700; flex: 1; }
  .count.alldone { color: #1a9a52; }
  .bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .readAt { font-size: 11px; color: #888; }
  button:disabled { opacity: .6; cursor: default; }
  button, select {
    font: inherit; font-size: 13px; border: 1px solid #ccd; background: #fff;
    border-radius: 8px; padding: 5px 9px; cursor: pointer; color: inherit;
  }
  button:hover { background: #eef; }
  button.on { background: #2b5cff; color: #fff; border-color: #2b5cff; }
  .list { display: flex; flex-direction: column; gap: 10px; }

  .group { display: flex; flex-direction: column; gap: 6px; }
  .gHead {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-weight: 800; font-size: 15px; padding: 2px 2px;
  }
  .gHead .arrow { width: 14px; color: #888; font-size: 11px; }
  .gHead .gLeft { margin-left: auto; font-size: 12px; font-weight: 600; color: #ff6b4a; }
  .gHead .gLeft.ok { color: #1a9a52; }

  .sub { background: #eceef3; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .prog { display: flex; flex-direction: column; gap: 3px; padding: 2px 2px 4px; }
  .pTop { display: flex; align-items: center; gap: 6px; }
  .pTop:empty { display: none; }
  .addTrack { margin-left: auto; padding: 2px 8px; font-size: 11px; color: #666; background: transparent; border-style: dashed; }
  .sHead { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 3px 4px; border-radius: 8px; }
  .sHead.turn { background: #fff3c4; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; flex: none;
           border: 1px solid #ccd; color: #888; background: #fff; cursor: pointer; }
  .turn .badge { background: #ffb300; border-color: #ffb300; color: #fff; cursor: default; }
  .gHead .addTrack { margin-left: 4px; }
  .gHead .addTrack:first-of-type { margin-left: 8px; }
  .sName { cursor: pointer; }
  .sName.noname { color: #aab; font-weight: 400; font-style: italic; }
  .nameEdit { font: inherit; font-size: 13px; font-weight: 700; color: #2b5cff; width: 110px;
              border: 1px solid #2b5cff; border-radius: 6px; padding: 2px 6px; }
  .delSub { padding: 2px 8px; font-size: 11px; color: #c33; border-color: #f0c4c4; background: transparent; }
  .row { cursor: grab; }
  .row.dragging { opacity: .35; }
  .sub.dropOn { outline: 2px dashed #2b5cff; outline-offset: -2px; background: #e8eeff; }
  .dropHint { text-align: center; font-size: 12px; color: #99a; padding: 10px 0; border: 1px dashed #c8cbd6; border-radius: 8px; }
  .gProg { background: #e3e9ff; }
  .range { display: inline-flex; align-items: center; gap: 2px; }
  .tilde { color: #888; font-size: 12px; }
  .delTrack { padding: 1px 7px; font-size: 13px; color: #aaa; background: transparent; border: none; margin-left: auto; }
  .delTrack:hover { color: #c33; background: transparent; }
  .sName { font-weight: 700; font-size: 13px; color: #2b5cff; margin-right: 2px; }
  .sHead select { padding: 3px 5px; font-size: 12px; max-width: 150px; }
  .sHead .step { padding: 3px 8px; font-size: 12px; }
  .sHead .moved { font-size: 11px; color: #999; }
  .sHead .nobook { font-size: 12px; color: #888; }

  .row {
    display: flex; align-items: center; gap: 8px; background: #fff;
    border: 1px solid #e3e4e8; border-radius: 10px; padding: 5px 8px;
  }
  .row:not(.done) { border-left: 4px solid #ff6b4a; }
  .chk {
    width: 26px; height: 26px; flex: none; border-radius: 50%; padding: 0;
    border: 2px solid #bbb; background: #fff; color: transparent; font-weight: 700;
  }
  .row.done .chk { background: #1a9a52; border-color: #1a9a52; color: #fff; }
  .name { width: 62px; flex: none; font-weight: 700; cursor: pointer; user-select: none;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .name { color: #999; font-weight: 400; }
  .memo {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; border: 1px solid transparent;
    background: #f6f7f9; border-radius: 6px; padding: 5px 7px;
  }
  .memo:focus { outline: none; border-color: #2b5cff; background: #fff; }
  .memo::placeholder { color: #b5b8c0; }

  .empty { text-align: center; color: #888; padding: 30px 0; font-size: 14px; line-height: 1.6; }
  .editor { display: none; background: #fff; border: 1px solid #e3e4e8; border-radius: 10px; padding: 10px; }
  .editor.show { display: block; }
  .editor .help { margin: 0 0 6px; font-size: 12px; color: #666; line-height: 1.6; white-space: pre-line; }
  .editor textarea { width: 100%; height: 300px; font: inherit; font-size: 14px; padding: 8px;
                     border: 1px solid #ccd; border-radius: 6px; resize: vertical; }
  .editor .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .msg { font-size: 12px; color: #c33; margin: -4px 0 6px; min-height: 0; }
  #placeholder { display: none; text-align: center; padding: 40px 12px; color: #666; }
  #placeholder button { margin-top: 10px; }

  /* ---- 인왕보카로 들이며 더한 것 ---- */
  .appTag { flex: none; font-size: 10px; font-weight: 700; color: #1a9a52; background: #e7f6ee;
            border: 1px solid #a9dcbf; border-radius: 6px; padding: 0 5px; line-height: 16px; }
  .row.byApp .chk { cursor: default; }
  .row.byApp .name { cursor: default; }
  .pool { background: #fff6e0; }
  .poolHead { font-size: 12px; font-weight: 700; color: #8a6d1f; padding: 2px 4px; }
  .pool .row { border-left: 1px solid #e3e4e8; }
  .pool .ban { font-size: 11px; color: #999; flex: 1; text-align: right; }
  .notice { background: #fff; border: 1px solid #e3e4e8; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px;
            font-size: 12px; line-height: 1.6; }
  .notice.warn { border-color: #f0c4c4; background: #fff5f5; color: #a33; }
  .notice.ask { border-color: #ffd27a; background: #fffaf0; }
  .notice b { font-weight: 700; }
  .notice .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  #login { display: block; max-width: 320px; margin: 40px auto; }
  #login[hidden] { display: none; }
  .gone { font-size: 12px; color: #c33; }
  #paste textarea { height: 120px; font-size: 12px; }
  #paste .msg { margin: 6px 0 0; }
  #login input[type=password] { width: 100%; font: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid #ccd; border-radius: 6px; }
  #login label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<div id="placeholder">
  체크리스트가 작은 창으로 떠 있어요.<br>
  <button id="backBtn">여기로 다시 가져오기</button>
</div>

<div id="app">
  <div class="editor" id="login">
    <div class="help">선생님 비밀번호</div>
    <input id="pw" type="password" placeholder="비밀번호">
    <label><input type="checkbox" id="auto"> 자동 로그인</label>
    <div class="btns"><button id="loginBtn" class="on">들어가기</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div id="main" hidden>
  <div class="top">
    <div class="count" id="count"></div>
    <div class="date" id="date"></div>
  </div>
  <div class="bar">
    <button id="pipBtn">📌 화면 위에 띄우기</button>
    <select id="groupSel"></select>
    <button id="leftBtn">안 준 애만</button>
    <button id="editBtn">명단 편집</button>
    <button id="reloadBtn">↻ 새로 불러오기</button>
    <span class="readAt" id="readAt"></span>
    <button id="importBtn" hidden>이 컴퓨터에 있던 것 올리기</button>
    <button id="pasteBtn" hidden>붙여넣어 올리기</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="notice"></div>
  <div class="editor" id="paste">
    <div class="help">옛 숙제체크 화면에서 「내보내기」 를 누르면 글이 복사돼요. 그 글을 여기 붙여넣고 올리세요.</div>
    <textarea id="pasteBox" spellcheck="false" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>
    <div class="msg" id="pasteMsg"></div>
    <div class="btns">
      <button id="pasteCancel">닫기</button>
      <button id="pasteGo" class="on">붙여넣어 올리기</button>
    </div>
  </div>

  <div class="editor" id="editor">
    <div class="help" id="editorHelp"></div>
    <textarea id="editBox" spellcheck="false"></textarea>
    <div class="btns">
      <button id="cancelBtn">취소</button>
      <button id="saveBtn" class="on">저장</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <datalist id="memoList"></datalist>
  </div>
</div>

<script>
/* 숙제 체크 — 원장님이 학원 PC 크롬(localStorage)에 들고 쓰시던 것을 인왕보카 서버로 옮겼다 (프롬프트 55).
   학생 명단은 인왕보카 학생 표에서 읽고(체크자료), 학생은 이름이 아니라 학생번호로 가리킨다.
   그룹·단계·교재·진도·보기 상태 = 체크설정 한 줄, 그날 체크·메모 = 체크기록 한 줄 (Code.gs).

   교재 = 인왕보카 단어장 (프롬프트 56). 손으로 적는 교재는 없다. 진도는 단어 번호 범위 { 단어장, 시작, 끝, 옮긴날, ts },
   레슨은 단어장의 레슨묶음으로 잘라 보여 주기만 한다. 옛 레슨 번호 → 번호 범위 환산은 「체크 셈」 의 진도로 한 곳. */
const KEY = 'hwcheck_v1';
let 단어장들 = [];                           // 인왕보카 단어장 [{이름, 레슨묶음, 단어수}] — 체크자료가 준다
let 번호없음 = [];                           // 학생번호가 없어 아직 못 쓰는 아이 이름 — 조용히 빼지 않고 보여 준다 (프롬프트 57)
let 번호채움탈 = '';                         // 들어올 때 학생번호채우기 가 안 됐으면 그 까닭
const app = document.getElementById('app');
const $ = id => app.querySelector('#' + id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ---------- 데이터 ----------

  const 옛책 = Array.isArray(d.books) ? d.books : [];     // 손으로 적던 교재(옛 꼴) — 진도를 단어장 번호로 바꾸는 데만 쓴다
  d = { groups: d.groups, view: d.view, 옮김: d.옮김 || null,
        students: [], day: today(), status: {}, history: {} };
  if (!Array.isArray(d.groups)) {
    d.groups = [{ id: 'g0', name: '', subs: [{ id: 'u0', name: '', ids: [], tracks: [newTrack()] }], tracks: [] }];
  }

  if (!d.view.folded) d.view.folded = {};
  옛꼴맞추기(d.groups);
  d.groups.forEach(g => [g, ...g.subs].forEach(o => { o.tracks = o.tracks.map(t => 진도로(t, 옛책, 단어장들).진도); }));
  return d;
}
let data = load(null);
let onlyLeft = false;
let editMode = null;

// ---------- 서버 ----------
const 창구 = VocabApi.defaultEndpoint;
const 부르기 = (fn, ...args) => VocabApi.request(창구, fn, args, '서버가 답하지 않았어요');
const 자동열쇠 = 'hb_auto';                 // teacher.html 과 같은 자동 로그인 기억
let 비번 = '';
let 앱 = new Set();                          // 오늘 앱으로 숙제를 받은 아이 (학생번호)
let 고친때 = 0;                              // 들고 있는 체크설정이 서버에서 언제 고친 것인지

let 충돌 = null;                             // 다른 곳에서 먼저 고친 체크설정 { 설정, 고친때 }

}

  const out = {};
  Object.keys(r || {}).forEach(id => { const x = r[id] || {}; out[id] = { done: !!x.줬나, memo: String(x.메모 || '') }; });

      else if (r && r.새것있음) { 충돌 = { 설정: r.설정, 고친때: r.고친때 }; renderNotice(); }
      else showMsg('그룹·진도를 저장하지 못했어요: ' + ((r && r.메시지) || ''));
    }

    showMsg('저장이 안 됐어요 — 10초 뒤 다시 해 볼게요');

// 체크자료 한 번에 — 처음 · 날이 바뀔 때 · 「새로 불러오기」 를 누를 때만. 저절로 되풀이해 읽지 않는다 (docs/서버사용량.md).

  if (보낸설정글 === null || (설정글() === 보낸설정글 && r.고친때 > 고친때)) {

// 「↻ 새로 불러오기」 — 한 번 누르면 한 번 읽는다. 읽는 동안은 단추를 잠가 두 번 읽지 않는다

let msgTimer;

const studentById = id => data.students.find(s => s.id === id);
const st = id => data.status[id] || (data.status[id] = { done: false, memo: '' });

// ---------- 진도 ----------
// t = 단어장 하나의 진도 { 단어장, 시작, 끝(단어 번호), 옮긴날, ts } — 숙제 범위와 같은 말 (예: 600-1 · 41~50)
// 레슨은 단어장의 레슨묶음으로 잘라 보여 주기만 한다 — 「레슨 5 (41~50)」
// 다음 ▶ / ◀ 은 범위 크기만큼 통째로 움직임 (41~50 → 51~60). 단어장 끝에 닿으면 멈추고 알려 준다 —
// 다음 단어장으로 저절로 넘어가지 않는다 (단어장 차례는 인왕보카에 없다)
// ts는 '다음 ▶'을 누른 시각. 교재가 여러 개면 ts가 가장 오래된 쪽이 오늘 차례
function newTrack(ts) { return { 단어장: '', 시작: 0, 끝: 0, 옮긴날: null, ts: ts || 0 }; }
function step(t, dir) {
  const r = 다음범위(bookByName(t.단어장), t, dir);
  if (r.말) showMsg(r.말);
  if (!r.범위) return;
  t.시작 = r.범위.시작; t.끝 = r.범위.끝;
  t.옮긴날 = today();
  if (dir > 0) t.ts = Date.now();
  save(); render();
}
function turnIndex(sub) {
  if (sub.tracks.length < 2) return -1;
  let best = 0;
  sub.tracks.forEach((t, i) => { if ((t.ts || 0) < (sub.tracks[best].ts || 0)) best = i; });
  return best;
}

const MAX_TRACKS = 4;

function subNameEl(sub, g) {

// isGroup: 큰 그룹 진도 (제목 줄에 이미 이름·추가 버튼이 있음)
function progressBar(sub, isGroup, g) {
  const box = el('div', 'prog');

  if (!isGroup && g) {
    head.append(subNameEl(sub, g));

  if (!isGroup && sub.tracks.length < MAX_TRACKS) head.append(addTrackBtn(sub, '+ 교재'));

  const turn = turnIndex(sub);
  sub.tracks.forEach((t, i) => {
    const line = el('div', 'sHead' + (i === turn ? ' turn' : ''));

    if (turn >= 0) {
      const badge = el('span', 'badge', i === turn ? '오늘' : '다음번');
      if (i !== turn) {
        badge.title = '눌러서 이 교재를 오늘 차례로';
        badge.onclick = () => { t.ts = Math.min(...sub.tracks.map(x => x.ts || 0)) - 1; save(); render(); };
      }
      line.append(badge);
    }

    // 교재 = 인왕보카 단어장. 목록에서 사라진 단어장 · 옛 교재는 버리지 않고 「없습니다」 로 보여 준다
    const bSel = el('select');
    const none = el('option', null, '단어장 선택'); none.value = ''; bSel.append(none);
    단어장들.forEach(b => { const o = el('option', null, b.이름); o.value = b.이름; bSel.append(o); });
    const book = bookByName(t.단어장);
    if (t.단어장 && !book) { const o = el('option', null, `${t.단어장} — 단어장에 없습니다`); o.value = t.단어장; o.disabled = true; bSel.append(o); }
    bSel.value = book ? book.이름 : (t.단어장 || '');
    bSel.onchange = () => {
      const 새 = bookByName(bSel.value);
      const 레슨수 = Math.max(1, Math.round((t.끝 - t.시작 + 1) / ((book && book.레슨묶음) || 10)) || 1);   // 몇 레슨씩 나가던지는 그대로
      t.단어장 = 새 ? 새.이름 : '';
      const r = 새 ? 범위맞추기(새, 1, 레슨수 * 새.레슨묶음) : { 시작: 0, 끝: 0 };
      t.시작 = r.시작; t.끝 = r.끝; t.옮긴날 = today(); delete t.옛교재;
      save(); render();
    };
    line.append(bSel);
    if (t.옛교재 && !t.단어장) line.append(el('span', 'gone', `옛 교재 「${t.옛교재}」 — 이 교재는 단어장에 없습니다`));
    if (t.단어장 && !book) line.append(el('span', 'gone', `${t.시작}~${t.끝}번`));

    if (book && !레슨들(book).length) line.append(el('span', 'nobook', '이 단어장에 단어가 없어요'));
    else if (book) {
      const ls = 레슨들(book);
      const 지금 = 범위맞추기(book, t.시작, t.끝);
      if (지금.시작 !== t.시작 || 지금.끝 !== t.끝) { t.시작 = 지금.시작; t.끝 = 지금.끝; }   // 단어 수를 넘으면 끝에서 자른다
      const 첫 = 레슨찾기(book, t.시작), 끝레슨 = 레슨찾기(book, t.끝);

      const range = el('span', 'range');
      const sSel = el('select');
      ls.forEach(l => { const o = el('option', null, 레슨이름(l)); o.value = l.번호; sSel.append(o); });
      sSel.value = 첫.번호;
      sSel.title = '시작';
      sSel.onchange = () => {
        const size = Math.max(1, t.끝 - t.시작 + 1);
        const l = ls[+sSel.value - 1];
        const r = 범위맞추기(book, l.시작, l.시작 + size - 1);   // 범위 크기는 유지
        t.시작 = r.시작; t.끝 = r.끝;
        t.옮긴날 = today(); save(); render();
      };
      const eSel = el('select');
      ls.forEach(l => { if (l.번호 >= 첫.번호) { const o = el('option', null, 레슨이름(l)); o.value = l.번호; eSel.append(o); } });
      eSel.value = 끝레슨.번호;
      eSel.title = '끝 (하나만 나가면 시작과 같게)';
      eSel.onchange = () => { t.끝 = ls[+eSel.value - 1].끝; t.옮긴날 = today(); save(); render(); };
      range.append(sSel, el('span', 'tilde', '~'), eSel);

      const prev = el('button', 'step', '◀'); prev.title = '이전 범위로 (차례는 안 바뀜)'; prev.onclick = () => step(t, -1);
      const next = el('button', 'step', '다음 ▶'); next.title = '다음 범위로'; next.onclick = () => step(t, 1);
      line.append(range, prev, next);
      if (t.시작 !== 첫.시작 || t.끝 !== 끝레슨.끝) line.append(el('span', 'moved', `${t.시작}~${t.끝}번`));
      if (t.옮긴날) line.append(el('span', 'moved', fmtDate(t.옮긴날)));
    }

    if (isGroup || sub.tracks.length > 1) {
      const del = el('button', 'delTrack', '×');
      del.title = '이 교재 빼기';
      del.onclick = () => { sub.tracks.splice(i, 1); save(); render(); };
      line.append(del);
    }
    box.append(line);
  });
  return box;
}

function studentRow(id, list) {

      if (g.name && g.tracks.length && 단어장들.length) {
        const gp = el('div', 'sub gProg');
        gp.append(progressBar(g, true));
        gBox.append(gp);
      }
      g.subs.forEach(sub => {
        const ids = sub.ids.filter(id => studentById(id) && (!onlyLeft || !isDone(id)));
        if (onlyLeft && !ids.length) return;
        const sBox = el('div', 'sub');
        if (sub.name || 단어장들.length || g.subs.length > 1) sBox.append(progressBar(sub, false, g));
        ids.forEach(id => sBox.append(studentRow(id, list)));
        if (!sub.ids.some(studentById)) sBox.append(el('div', 'dropHint', '학생 줄을 끌어다 여기에 놓으세요'));
        sBox.ondragover = e => { if (!dragId) return; e.preventDefault(); sBox.classList.add('dropOn'); };
        sBox.ondragleave = e => { if (!sBox.contains(e.relatedTarget)) sBox.classList.remove('dropOn'); };
        sBox.ondrop = e => {
          e.preventDefault();
          const id = dragId || e.dataTransfer.getData('text/plain');
          if (!id) return;
          const target = e.target.closest('.row');
          const before = target && target.dataset.id !== id ? target.dataset.id : null;
          moveStudent(id, sub, before);
        };
        gBox.append(sBox);
      });
    }
    list.append(gBox);
  });

  if (!list.querySelector('.row') && !list.querySelector('.gHead') && onlyLeft) {
    list.append(el('div', 'empty', '숙제 다 줬어요.'));
  }
  updateCount();
  updateDatalist();
}

// ---------- 아직 어느 단계에도 없는 아이 (명단 편집 때만) ----------
// 인왕보카에 새로 들어온 아이는 여기 저절로 나타난다. 끌어서 단계에 넣고, 단계에서 여기로 끌면 뺀다
function removeStudent(id) {
  data.groups.forEach(g => g.subs.forEach(s => { s.ids = s.ids.filter(x => x !== id); }));
  save(); render();
}
function poolBox() {
  const placed = new Set(data.groups.flatMap(idsOfGroup));
  const kids = data.students.filter(s => !placed.has(s.id))
    .sort((a, b) => (a.ban || '힣').localeCompare(b.ban || '힣') || a.name.localeCompare(b.name));
  const box = el('div', 'sub pool');
  box.append(el('div', 'poolHead', `아직 어느 단계에도 없는 아이 ${kids.length}명 — 끌어다 단계에 놓으세요`));
  kids.forEach(s => {
    const row = el('div', 'row');
    row.dataset.id = s.id;
    row.draggable = true;
    row.ondragstart = e => {
      dragId = s.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', s.id);
      setTimeout(() => row.classList.add('dragging'), 0);
    };
    row.ondragend = () => { dragId = null; row.classList.remove('dragging'); app.querySelectorAll('.dropOn').forEach(x => x.classList.remove('dropOn')); };
    row.append(el('span', 'name', s.name), el('span', 'ban', s.ban || '반 없음'));
    row.querySelector('.name').title = s.name;
    box.append(row);
  });
  if (!kids.length) box.append(el('div', 'dropHint', '모두 단계에 들어 있어요. 빼려면 학생 줄을 여기로 끌어 오세요'));
  box.ondragover = e => { if (!dragId) return; e.preventDefault(); box.classList.add('dropOn'); };
  box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove('dropOn'); };
  box.ondrop = e => {
    e.preventDefault();
    const id = dragId || e.dataTransfer.getData('text/plain');
    if (id && placed.has(id)) removeStudent(id);
  };
  return box;
}

// ---------- 그룹 편집 (텍스트) — # 과 ## 만. 학생은 끌어서 넣는다 ----------
function groupsToText() {
  const out = [];
  const gs = [...data.groups].sort((a, b) => (a.name ? 1 : 0) - (b.name ? 1 : 0));
  gs.forEach(g => {
    if (g.name) out.push('# ' + g.name);
    const subs = [...g.subs].sort((a, b) => (a.name ? 1 : 0) - (b.name ? 1 : 0));
    subs.forEach(s => { if (s.name) out.push('## ' + s.name); });
    out.push('');
  });
  return out.join('\n').trim();
}

function textToGroups(text) {
  const oldGroups = data.groups.map(g => ({ ...g, used: false, subs: g.subs.map(s => ({ ...s, used: false })) }));
  const groups = [];
  let G = null, S = null;

  const newGroup = name => {
    const old = oldGroups.find(o => !o.used && o.name === name);
    if (old) old.used = true;
    const g = { id: old ? old.id : uid('g'), name, subs: [], tracks: old ? old.tracks.map(t => ({ ...t })) : [], _old: old };
    groups.push(g);
    return g;
  };
  const newSub = (g, name) => {
    const old = g._old && g._old.subs.find(o => !o.used && o.name === name);
    if (old) old.used = true;
    const s = old ? { id: old.id, name, ids: old.ids.slice(), tracks: old.tracks.map(t => ({ ...t })) }
                  : { id: uid('u'), name, ids: [], tracks: [newTrack()] };
    g.subs.push(s);
    return s;
  };

  const 읽음 = 그룹글읽기(text);
  읽음.줄들.forEach(x => {
    if (x.단계) {
      if (!G) G = newGroup('');
      S = newSub(G, x.이름);
    } else {
      G = newGroup(x.이름);
      S = null;
    }
  });
  // ## 가 없는 그룹은 이름 없는 단계 하나 — 전에 그 자리에 있던 아이들은 그대로
  groups.forEach(g => { if (!g.subs.length) newSub(g, ''); delete g._old; });
  // 맨 위 이름 없는 그룹(# 없이 쓰던 것)은 글에 줄이 없다 — 아이가 들어 있으면 남긴다
  const 이름없던 = oldGroups.find(o => !o.used && !o.name && o.subs.some(s => s.ids.length));
  if (이름없던) groups.unshift({ id: 이름없던.id, name: '', tracks: 이름없던.tracks, subs: 이름없던.subs.map(({ used, ...s }) => s) });
  data.groups = groups.length ? groups : [{ id: uid('g'), name: '', subs: [{ id: uid('u'), name: '', ids: [], tracks: [newTrack()] }], tracks: [] }];
  // 이름 줄은 안 받는다 — 버리되 말해 준다 (학생은 인왕보카 명단에서 끌어 온다)
  if (읽음.무시한.length) showMsg('이름은 여기서 안 받습니다. 아래 목록에서 끌어다 넣으세요. 무시한 줄: ' + 읽음.무시한.join(', '), 15000);
  return 읽음.무시한;
}

/* ==== 체크 셈 시작 — 화면(DOM)을 안 쓰는 셈. tests/hw-check.test.mjs 가 떼어서 돌린다 ==== */
// 인왕보카에서 빠진 아이(번호가 명단에 없음)는 단계에서도 뺀다. 뺀 수를 돌려준다
function 명단맞추기(groups, 번호들) {
  const 있음 = new Set(번호들);
  let 뺀 = 0;
  groups.forEach(g => g.subs.forEach(s => {
    const 남 = s.ids.filter((id, i) => 있음.has(id) && s.ids.indexOf(id) === i);
    뺀 += s.ids.length - 남.length;
    s.ids = 남;
  }));
  return 뺀;
}
// ○ = 앱으로 나갔거나(저절로) 손으로 눌렀거나
function 줬나(status, 앱, id) { return 앱.has(id) || !!(status[id] && status[id].done); }
// 손으로 누르기 — 앱으로 켜진 ○ 는 사실이니 끄지 못한다(아무 일도 없다). 바뀌었으면 참
function 손으로뒤집기(status, 앱, id) {
  if (앱.has(id)) return false;
  const x = status[id] || (status[id] = { done: false, memo: '' });
  x.done = !x.done;
  return true;
}
// ---- 단어장 · 레슨 · 번호 범위 ----
// 책 = 인왕보카 단어장 { 이름, 레슨묶음, 단어수 }. 레슨묶음이 비면 10(엔진의 기본레슨 — 체크자료가 이미 채워 준다)
function 묶음(책) { return Math.max(1, Math.round(Number(책 && 책.레슨묶음) || 10)); }
function 단어장찾기(목록, 이름) {
  const n = String(이름 || '').trim();
  if (!n) return null;
  const 빈칸뺌 = t => String(t || '').replace(/\s/g, '');
  return 목록.find(b => b.이름 === n) || 목록.find(b => 빈칸뺌(b.이름) === 빈칸뺌(n)) || null;
}
// 레슨 = 레슨묶음으로 자른 번호 범위. 마지막 레슨은 단어 수에서 잘린다
function 레슨들(책) {
  const k = 묶음(책), n = Math.max(0, Math.floor(Number(책.단어수) || 0)), out = [];
  for (let 시작 = 1, 번호 = 1; 시작 <= n; 시작 += k, 번호++) out.push({ 번호, 시작, 끝: Math.min(시작 + k - 1, n) });
  return out;
}
function 레슨찾기(책, 번호) {
  const ls = 레슨들(책);
  return ls.find(l => 번호 >= l.시작 && 번호 <= l.끝) || ls[번호 < 1 ? 0 : ls.length - 1];
}
function 레슨이름(l) { return `레슨 ${l.번호} (${l.시작}~${l.끝})`; }
// 1 ≤ 시작 ≤ 끝 ≤ 단어 수 — 단어 수를 넘는 범위는 끝에서 자른다
function 범위맞추기(책, 시작, 끝) {
  const n = Math.max(0, Math.floor(Number(책.단어수) || 0));
  if (!n) return { 시작: 0, 끝: 0 };
  const s = Math.min(n, Math.max(1, Math.round(Number(시작)) || 1));
  const e = Math.min(n, Math.max(s, Math.round(Number(끝)) || s));
  return { 시작: s, 끝: e };
}
// 다음 ▶(dir 1) · ◀(dir -1) — 범위 크기만큼 통째로. 끝에 닿으면 { 말 } 만 (다음 단어장으로 넘어가지 않는다)
function 다음범위(책, t, dir) {
  if (!책) return { 말: '단어장을 먼저 골라 주세요.' };
  const n = Math.max(0, Math.floor(Number(책.단어수) || 0));
  if (!n) return { 말: `「${책.이름}」 에 단어가 없어요.` };
  const 지금 = 범위맞추기(책, t.시작, t.끝), 크기 = 지금.끝 - 지금.시작 + 1;
  if (dir > 0) {
    if (지금.끝 >= n) return { 말: `「${책.이름}」 끝이에요 (${n}번까지). 다음에 할 단어장을 골라 주세요.` };
    const s = 지금.끝 + 1;
    return { 범위: { 시작: s, 끝: Math.min(s + 크기 - 1, n) } };
  }
  if (지금.시작 <= 1) return { 말: `「${책.이름}」 맨 앞이에요.` };
  const s = Math.max(1, 지금.시작 - 크기);
  return { 범위: { 시작: s, 끝: Math.min(s + 크기 - 1, n) } };
}
// 진도 하나를 지금 꼴로. 옛 꼴(손으로 적은 교재 { book, lesson, end, moved })이면 번호 범위로 환산한다:
//   시작 = 레슨번호 × 레슨묶음 + 1,  끝 = (끝레슨번호 + 1) × 레슨묶음  (레슨번호는 0부터 — 옛 화면이 그렇게 담았다)
// 옛 교재 이름이 단어장에 없으면 { 못찾은교재 } — 진도 줄에는 옛교재 로 남긴다 (버리지 않는다)
function 진도로(t, 옛책, 목록) {
  t = t || {};
  if ('단어장' in t) {
    const 책 = 단어장찾기(목록, t.단어장);
    const r = 책 ? 범위맞추기(책, t.시작, t.끝) : { 시작: Number(t.시작) || 0, 끝: Number(t.끝) || 0 };
    const 진도 = { 단어장: 책 ? 책.이름 : String(t.단어장 || ''), 시작: r.시작, 끝: r.끝, 옮긴날: t.옮긴날 || null, ts: Number(t.ts) || 0 };
    if (t.옛교재 && !진도.단어장) 진도.옛교재 = t.옛교재;
    return { 진도 };
  }
  const 옮긴날 = t.moved || null, ts = Number(t.ts) || 0;
  const 옛 = (옛책 || []).find(b => b.id === t.book);
  if (!옛) return { 진도: { 단어장: '', 시작: 0, 끝: 0, 옮긴날, ts } };          // 옛날에도 교재를 안 골랐던 줄
  const ls = Math.max(0, Number(t.lesson) || 0), le = Math.max(ls, t.end == null ? ls : Number(t.end) || 0);
  const 책 = 단어장찾기(목록, 옛.name);
  if (!책) {
    const 레슨 = k => (옛.lessons && 옛.lessons[k]) || `레슨 ${k + 1}`;
    return { 진도: { 단어장: '', 시작: 0, 끝: 0, 옮긴날, ts, 옛교재: `${옛.name} · ${레슨(ls)}${le > ls ? ' ~ ' + 레슨(le) : ''}` }, 못찾은교재: 옛.name };
  }
  const r = 범위맞추기(책, ls * 묶음(책) + 1, (le + 1) * 묶음(책));
  return { 진도: { 단어장: 책.이름, 시작: r.시작, 끝: r.끝, 옮긴날, ts } };
}
// 아주 옛 꼴 — 단계에 진도가 하나뿐이던 때(sub.book) · 그룹 진도가 없던 때
function 옛꼴맞추기(groups) {
  groups.forEach(g => {
    if (!Array.isArray(g.subs)) g.subs = [];
    if (!Array.isArray(g.tracks)) g.tracks = [];
    g.subs.forEach(s => {
      if (!Array.isArray(s.ids)) s.ids = [];
      if (!Array.isArray(s.tracks)) {
        s.tracks = [{ book: s.book || null, lesson: s.lesson || 0, moved: s.moved || null, ts: 0 }];
        delete s.book; delete s.lesson; delete s.moved;
      }
    });
  });
  return groups;
}
// 붙여넣은 글 → { 자료 } 또는 { 까닭 } — JSON 이 아니면 무엇이 잘못됐는지 말한다
function 붙인글읽기(글) {
  const t = String(글 || '').trim();
  if (!t) return { 까닭: '붙여넣은 글이 없어요.' };
  let d;
  try { d = JSON.parse(t); }
  catch (e) { return { 까닭: 'JSON 이 아니에요 — ' + e.message + (t[0] !== '{' ? ' (글이 { 로 시작해야 해요. 옛 화면의 「내보내기」 글을 통째로 붙여넣어 주세요)' : ' (글이 잘렸을 수 있어요. 통째로 다시 붙여넣어 주세요)') }; }
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { 까닭: '숙제 체크 자료가 아니에요 — { … } 꼴이어야 해요.' };
  if (!Array.isArray(d.students) && !Array.isArray(d.groups)) return { 까닭: '숙제 체크 자료가 아니에요 — 학생(students)도 그룹(groups)도 없어요.' };
  return { 자료: d };
}
// 옛 자료(옛 숙제체크 화면의 hwcheck_v1) → 서버 체크설정.
//   학생은 이름으로 인왕보카 아이를 찾아 학생번호로. 못 찾은 이름(같은 이름이 둘인 것도)은 올리지 않고 못찾은 에.
//   진도는 진도로 가 번호 범위로 환산. 단어장에 없는 교재는 못찾은교재 에 — 조용히 버리지 않는다
function 옛자료옮기기(old, 학생들, 목록) {
  목록 = 목록 || [];
  const 빈칸뺌 = t => String(t || '').replace(/\s/g, '');
  const 찾기 = 이름 => {
    let 맞음 = 학생들.filter(x => x.이름 === 이름);
    if (!맞음.length) 맞음 = 학생들.filter(x => 빈칸뺌(x.이름) === 빈칸뺌(이름));
    if (맞음.length === 1) return { 번호: 맞음[0].번호 };
    return { 까닭: 맞음.length ? `인왕보카에 「${이름}」 이 ${맞음.length}명이에요` : '' };
  };
  const 옛학생 = Array.isArray(old.students) ? old.students : [];
  const 옛이름 = id => { const s = 옛학생.find(x => x.id === id); return s ? String(s.name || '').trim() : ''; };
  let groups = Array.isArray(old.groups) ? old.groups
    : [{ id: 'g0', name: '', subs: [{ id: 'u0', name: '', ids: 옛학생.map(s => s.id), book: old.book, lesson: old.lesson, moved: old.moved }] }];
  groups = 옛꼴맞추기(JSON.parse(JSON.stringify(groups)));
  const 옛책 = Array.isArray(old.books) ? old.books : [];
  const 못찾은 = [], 넣은 = new Set(), 못교재 = new Map();
  const 진도바꾸기 = (tracks, 자리) => tracks.map(t => {
    const r = 진도로(t, 옛책, 목록);
    if (r.못찾은교재) {
      if (!못교재.has(r.못찾은교재)) 못교재.set(r.못찾은교재, []);
      if (자리 && !못교재.get(r.못찾은교재).includes(자리)) 못교재.get(r.못찾은교재).push(자리);
    }
    return r.진도;
  });
  groups.forEach(g => {
    g.tracks = 진도바꾸기(g.tracks, g.name);
    g.subs.forEach(s => {
      const 자리 = [g.name, s.name].filter(Boolean).join(' › ');
      s.tracks = 진도바꾸기(s.tracks, 자리);
      s.ids = s.ids.map(id => {
        const 이름 = 옛이름(id);
        if (!이름) return null;
        const r = 찾기(이름);
        if (!r.번호) { 못찾은.push({ 이름, 자리, 까닭: r.까닭 }); return null; }
        if (넣은.has(r.번호)) return null;         // 같은 아이가 두 자리에 — 처음 자리만
        넣은.add(r.번호);
        return r.번호;
      }).filter(Boolean);
    });
  });
  return {
    설정: { groups, view: old.view || { group: 'all', folded: {} } },
    못찾은, 못찾은교재: [...못교재].map(([교재, 자리들]) => ({ 교재, 자리: 자리들.join(', ') })),
    옮긴수: 넣은.size
  };
}
// 그룹 편집 글 → { 줄들: [{ 단계, 이름 }], 무시한: [줄…] } — # 은 큰 그룹, ## 는 단계. 그 밖의 줄(이름 등)은 무시한 에
function 그룹글읽기(글) {
  const 줄들 = [], 무시한 = [];
  String(글 || '').split('\n').map(x => x.trim()).filter(Boolean).forEach(line => {
    if (line.startsWith('##')) 줄들.push({ 단계: true, 이름: line.replace(/^#+/, '').trim() });
    else if (line.startsWith('#')) 줄들.push({ 단계: false, 이름: line.replace(/^#+/, '').trim() });
    else 무시한.push(line);
  });
  return { 줄들, 무시한 };
}

// ---------- 들어가기 — teacher.html 과 같은 길 (선생님로그인) ----------
async function 들어가기(pw, 기억할까) {
  $('loginMsg').textContent = '확인 중…';
  try {
    const r = await 부르기('선생님로그인', pw);
    if (!r || !r.ok) {
      $('loginMsg').textContent = '비밀번호가 다릅니다.';
      try { const a = JSON.parse(localStorage.getItem(자동열쇠) || 'null'); if (a && a.역할 === '선생님') localStorage.removeItem(자동열쇠); } catch (e) {}
      return;
    }
    if (기억할까) { try { localStorage.setItem(자동열쇠, JSON.stringify({ 역할: '선생님', 비번: pw })); } catch (e) {} }
    비번 = pw;
    data.day = today();
    // 학생번호 — 번호가 빈 아이에게만 붙인다 (채울 아이가 없으면 아무것도 안 쓴다). 들어올 때 한 번만 (새로 불러올 때는 안 부른다).
    // 안 돼도 화면은 뜬다 — 까닭은 알림 칸에 남긴다
    번호채움탈 = '';
    try {
      const f = await 부르기('학생번호채우기', pw);
      if (!f || !f.ok) 번호채움탈 = (f && f.메시지) || '서버가 거절했어요';
    } catch (e) { 번호채움탈 = e.message || String(e); }
    if (!(await 불러오기())) { $('loginMsg').textContent = '자료를 못 불러왔어요. 새로고침해 주세요.'; 비번 = ''; return; }
    $('login').hidden = true; $('main').hidden = false;
    $('loginMsg').textContent = '';
    render();
  } catch (e) { $('loginMsg').textContent = '들어가지 못했어요. ' + e.message; }
}
$('loginBtn').onclick = () => 들어가기($('pw').value.trim(), $('auto').checked);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

// 저절로 되풀이해 읽지 않는다 — 앱으로 나간 숙제(저절로 ○)는 「↻ 새로 불러오기」 로 받아 온다 (프롬프트 58)
// 창을 닫거나 숨길 때 못 보낸 것을 바로 보낸다
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });
window.addEventListener('pagehide', () => { if (saveTimer) flush(); });
setInterval(() => { if (rollover() && !editMode) render(); }, 30000);

(() => {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(자동열쇠) || 'null'); } catch (e) {}
  if (a && a.역할 === '선생님' && a.비번) { $('auto').checked = true; 들어가기(a.비번, true); }
})();
